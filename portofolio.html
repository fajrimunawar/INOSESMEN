<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFOTRINK — Dokumentasi Perjalanan Pengembangan Pribadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1a3a; --navy-2:#142850; --blue:#3b82f6; --blue-2:#60a5fa; --blue-soft:#dbeafe;
  --ink:#0f172a; --gray:#475569; --gray-2:#94a3b8; --border:#e2e8f0; --bg:#fafaf9; --white:#fff;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

/* Top nav */
.topnav{position:sticky;top:0;z-index:100;background:rgba(250,250,249,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topnav-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;max-width:1200px;margin:0 auto;gap:16px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.1em;color:var(--navy);white-space:nowrap}
.topnav nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.topnav nav a{font-size:12px;color:var(--gray);padding:6px 9px;border-radius:6px;white-space:nowrap;transition:all .2s}
.topnav nav a:hover{color:var(--navy);background:var(--blue-soft)}

/* Sections */
.section{padding:clamp(64px,8vw,96px) 0;border-bottom:1px solid var(--border);position:relative}
.section-num{font-family:var(--serif);font-size:12px;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;margin-bottom:10px}
.section-title{font-family:var(--serif);font-size:clamp(26px,3vw,36px);font-weight:600;color:var(--navy);margin-bottom:12px;letter-spacing:-.01em}
.section-sub{font-size:15px;color:var(--gray);max-width:680px;margin-bottom:40px}

/* Section 1: Cover */
.cover{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 24px 60px;max-width:920px;margin:0 auto}
.cover h1{font-family:var(--serif);font-size:clamp(56px,11vw,128px);font-weight:600;color:var(--navy);line-height:.95;letter-spacing:-.035em;margin-bottom:28px}
.cover .subtitle{font-size:clamp(16px,1.8vw,19px);color:var(--gray);max-width:660px;line-height:1.6;margin-bottom:28px}
.cover .copyright{font-size:13px;color:var(--gray-2);margin-bottom:56px}
.cover .toc{border-top:1px solid var(--border);padding-top:28px}
.cover .toc-title{font-size:11px;letter-spacing:.18em;color:var(--gray-2);text-transform:uppercase;margin-bottom:18px;font-weight:500}
.cover .toc ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 32px}
.cover .toc a{font-size:14px;color:var(--gray);padding:7px 0;display:flex;gap:14px;transition:color .15s;border-radius:4px}
.cover .toc a:hover{color:var(--blue)}
.cover .toc .num{color:var(--gray-2);font-variant-numeric:tabular-nums;min-width:22px;font-size:12px;padding-top:2px}

/* Section 2: Map */
.map-hint{font-size:13px;color:var(--gray-2);text-align:center;margin-bottom:28px;padding:10px 16px;background:var(--white);border:1px solid var(--border);border-radius:8px;display:inline-block}
.map-hint-wrap{text-align:center}
.map-container{position:relative}
.map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(60px,10vw,140px);position:relative;z-index:2}
.map-col{display:flex;flex-direction:column;gap:14px}
.map-col-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray-2);margin-bottom:6px;font-weight:500}
.map-box{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;transition:all .25s;position:relative;z-index:2}
.map-box:hover{border-color:var(--blue-2);box-shadow:0 4px 12px rgba(59,130,246,.12)}
.map-box.active{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 16px rgba(59,130,246,.18)}
.map-box h4{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--navy);margin-bottom:3px}
.map-box p{font-size:12.5px;color:var(--gray);line-height:1.5}
.map-results-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gray-2);margin:56px 0 16px;font-weight:500}
.map-results{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.result-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:18px;opacity:.45;transition:all .3s;cursor:pointer}
.result-card.active{opacity:1;border-color:var(--blue);box-shadow:0 6px 20px rgba(59,130,246,.18)}
.result-card h5{font-family:var(--serif);font-size:14.5px;color:var(--navy);margin-bottom:6px;line-height:1.3}
.result-card p{font-size:12.5px;color:var(--gray);margin-bottom:10px;line-height:1.5}
.result-card .status{font-size:10.5px;color:var(--gray-2);text-transform:uppercase;letter-spacing:.1em}
.result-card.active .status{color:var(--blue)}

/* Section 3: Library */
.library{display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:start}
.shelf-area{background:linear-gradient(180deg,#faf8f4 0%,#f0ece4 100%);border-radius:16px;padding:28px 24px;border:1px solid var(--border)}
.shelf{display:flex;align-items:flex-end;gap:5px;margin-bottom:14px;padding-bottom:6px;border-bottom:3px solid #8b6f47;min-height:120px}
.shelf:last-child{border-bottom:none;margin-bottom:0}
.book{flex:1;min-width:0;cursor:pointer;border-radius:2px 2px 0 0;transition:transform .2s;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset -2px 0 4px rgba(0,0,0,.18),inset 2px 0 2px rgba(255,255,255,.12)}
.book:hover{transform:translateY(-8px)}
.book.active{outline:3px solid var(--blue);outline-offset:2px;transform:translateY(-8px)}
.book span{writing-mode:vertical-rl;text-orientation:mixed;color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.02em;padding:8px 0;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;line-height:1.2}
.book-info{position:sticky;top:100px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:26px;min-height:280px}
.book-info .placeholder{color:var(--gray-2);font-size:14px;text-align:center;padding:40px 0}
.book-info h3{font-family:var(--serif);font-size:19px;color:var(--navy);margin-bottom:6px;line-height:1.35}
.book-info .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);margin-bottom:14px;display:block;font-weight:500}
.book-info .sum{font-size:14px;color:var(--gray);margin-bottom:18px;line-height:1.6}
.book-info .status-tag{display:inline-block;font-size:11px;color:var(--gray-2);border:1px solid var(--border);padding:3px 10px;border-radius:100px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:500;transition:all .2s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--blue)}
.btn-outline{border:1.5px solid var(--border);color:var(--navy)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}

/* Section 4: Alphabet */
.alpha-hero{font-family:var(--serif);font-size:clamp(64px,13vw,180px);font-weight:600;color:var(--navy);line-height:.85;letter-spacing:-.045em;margin-bottom:24px}
.alpha-desc{font-size:15px;color:var(--gray);max-width:640px;margin-bottom:32px}
.alpha-nav{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.alpha-nav button{width:36px;height:36px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--gray);transition:all .2s}
.alpha-nav button:hover:not(:disabled){background:var(--blue-soft);color:var(--navy)}
.alpha-nav button.active{background:var(--navy);color:#fff}
.alpha-nav button:disabled{color:var(--gray-2);opacity:.35;cursor:not-allowed}
.alpha-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;min-height:120px}
.alpha-item{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px 20px;cursor:pointer;transition:all .2s}
.alpha-item:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.06)}
.alpha-item h4{font-family:var(--serif);font-size:15.5px;color:var(--navy);margin-bottom:5px;line-height:1.35}
.alpha-item p{font-size:13px;color:var(--gray);line-height:1.5}
.alpha-empty{padding:32px;text-align:center;color:var(--gray-2);font-size:14px;background:var(--white);border:1px dashed var(--border);border-radius:10px;grid-column:1/-1}

/* Section 5: Timeline */
.timeline{position:relative;padding-left:36px;max-width:760px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:28px;cursor:pointer;transition:transform .2s}
.tl-item:hover{transform:translateX(4px)}
.tl-item::before{content:'';position:absolute;left:-33px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--white);border:2px solid var(--blue);transition:background .2s}
.tl-item:hover::before{background:var(--blue)}
.tl-item.plan::before{border-color:var(--gray-2);border-style:dashed}
.tl-item time{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:500}
.tl-item.plan time{color:var(--gray-2)}
.tl-item h4{font-family:var(--serif);font-size:17px;color:var(--navy);margin:5px 0 5px;line-height:1.35}
.tl-item p{font-size:13.5px;color:var(--gray);line-height:1.6}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column}
.card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.card-img{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-family:var(--serif);font-size:26px;position:relative}
.card-img .badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--navy);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;font-weight:600}
.card-body{padding:18px 20px;flex:1;display:flex;flex-direction:column}
.card-meta{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);margin-bottom:7px;font-weight:500}
.card h4{font-family:var(--serif);font-size:17px;color:var(--navy);margin-bottom:7px;line-height:1.35}
.card p{font-size:13.5px;color:var(--gray);flex:1;line-height:1.55}
.card-status{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--gray-2);display:flex;justify-content:space-between;align-items:center}
.card-status .dot{width:6px;height:6px;border-radius:50%;background:var(--gray-2);display:inline-block;margin-right:6px;vertical-align:middle}
.card-status .dot.done{background:#10b981}
.card-status .dot.active{background:var(--blue)}
.card-status .dot.plan{background:var(--gray-2)}

/* Process */
.process{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px}
.process::-webkit-scrollbar{height:6px}
.process::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.proc-step{flex:0 0 230px;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:20px;position:relative;cursor:pointer;transition:all .2s}
.proc-step:hover{border-color:var(--blue-2);transform:translateY(-2px)}
.proc-step.done{border-color:#10b981}
.proc-step.active{border-color:var(--blue);background:var(--blue-soft)}
.proc-step .num{font-family:var(--serif);font-size:28px;color:var(--blue);line-height:1;margin-bottom:10px}
.proc-step.done .num{color:#10b981}
.proc-step h4{font-size:14.5px;color:var(--navy);margin-bottom:5px;line-height:1.35}
.proc-step p{font-size:12.5px;color:var(--gray);line-height:1.5}
.proc-step .status{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:500}
.proc-step.done .status{color:#10b981}

/* Archive */
.archive-list{display:flex;flex-direction:column;gap:6px}
.arch-item{display:grid;grid-template-columns:90px 1fr 120px;gap:16px;padding:14px 18px;background:var(--white);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;align-items:center}
.arch-item:hover{border-color:var(--blue);background:var(--blue-soft)}
.arch-item .year{font-family:var(--serif);font-size:16px;color:var(--navy);font-weight:500}
.arch-item .title{font-size:13.5px;color:var(--ink);font-weight:500}
.arch-item .type{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gray-2);text-align:right}

/* Plans */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.plan{background:var(--white);border-left:3px solid var(--blue);padding:18px 20px;border-radius:8px;cursor:pointer;transition:all .2s;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.plan:hover{background:var(--blue-soft);transform:translateX(3px)}
.plan .status-badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:7px;font-weight:500}
.plan h4{font-family:var(--serif);font-size:15.5px;color:var(--navy);margin-bottom:5px;line-height:1.35}
.plan p{font-size:13px;color:var(--gray);line-height:1.5}

/* Search */
.search-bar{display:flex;gap:12px;margin-bottom:20px}
.search-bar input{flex:1;padding:14px 18px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:var(--white);color:var(--ink)}
.search-bar input:focus{outline:none;border-color:var(--blue)}
.search-results{display:flex;flex-direction:column;gap:6px;min-height:100px}
.search-result{padding:14px 18px;background:var(--white);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.search-result:hover{border-color:var(--blue)}
.search-result .type{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:500;margin-bottom:3px}
.search-result h5{font-family:var(--serif);font-size:15px;color:var(--navy);margin-bottom:3px;line-height:1.35}
.search-result p{font-size:13px;color:var(--gray);line-height:1.5}
.search-empty{padding:40px 20px;text-align:center;color:var(--gray-2);font-size:14px;background:var(--white);border:1px dashed var(--border);border-radius:8px}

/* References */
.ref-list{display:flex;flex-direction:column;gap:10px}
.ref-item{padding:18px 20px;background:var(--white);border:1px solid var(--border);border-radius:10px}
.ref-item h4{font-size:14.5px;color:var(--navy);margin-bottom:3px;line-height:1.35}
.ref-item .ref-meta{font-size:11.5px;color:var(--gray-2);margin-bottom:8px}
.ref-item p{font-size:13px;color:var(--gray);line-height:1.5}
.ref-item .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue-soft);padding:2px 8px;border-radius:100px;margin-top:8px}

/* Close */
.close-section{background:var(--navy);color:#fff;padding:96px 24px;text-align:center}
.close-inner{max-width:700px;margin:0 auto}
.close-section h2{font-family:var(--serif);font-size:clamp(28px,4vw,42px);font-weight:600;margin-bottom:18px;line-height:1.2}
.close-section p{color:rgba(255,255,255,.7);margin-bottom:32px;font-size:15.5px}
.close-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:44px}
.close-links a{padding:10px 20px;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-size:13.5px;transition:all .2s}
.close-links a:hover{background:#fff;color:var(--navy);border-color:#fff}
.close-copy{font-size:12px;color:rgba(255,255,255,.4);padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}

/* Detail page */
.detail-page{max-width:780px;margin:0 auto;padding:80px 24px 100px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--blue);margin-bottom:32px;font-weight:500}
.back-link:hover{text-decoration:underline}
.detail-meta{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.detail-meta span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gray-2);padding:4px 11px;border:1px solid var(--border);border-radius:100px}
.detail-meta .status{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-soft)}
.detail-page h1{font-family:var(--serif);font-size:clamp(30px,4.5vw,44px);color:var(--navy);line-height:1.15;letter-spacing:-.02em;margin-bottom:18px}
.detail-page .lead{font-size:17px;color:var(--gray);line-height:1.65;margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--border)}
.detail-body h2{font-family:var(--serif);font-size:22px;color:var(--navy);margin:32px 0 12px;line-height:1.3}
.detail-body p{margin-bottom:14px;color:var(--ink);font-size:15px;line-height:1.7}
.detail-body ul{margin:12px 0 16px 20px}
.detail-body li{margin-bottom:8px;font-size:15px;color:var(--ink);line-height:1.65}
.placeholder-note{padding:20px 22px;background:var(--blue-soft);border-radius:10px;font-size:14px;color:var(--navy);margin-top:28px;border-left:3px solid var(--blue);line-height:1.6}
.detail-nav{display:flex;justify-content:space-between;margin-top:60px;padding-top:32px;border-top:1px solid var(--border);gap:16px;flex-wrap:wrap}

/* Responsive */
@media(max-width:960px){
  .library{grid-template-columns:1fr}
  .book-info{position:static;min-height:auto}
  .map-grid{grid-template-columns:1fr;gap:24px}
  .map-svg{display:none}
  .map-results{grid-template-columns:repeat(2,1fr)}
  .map-col-label{display:none}
  .arch-item{grid-template-columns:1fr;gap:6px}
  .arch-item .type{text-align:left}
  .topnav nav{display:none}
  .process{flex-direction:column}
  .proc-step{flex:1 1 auto}
}
@media(max-width:600px){
  .map-results{grid-template-columns:1fr}
  .cover .toc ol{grid-template-columns:1fr}
  .card-grid{grid-template-columns:1fr}
  .plan-grid{grid-template-columns:1fr}
  .alpha-list{grid-template-columns:1fr}
  .detail-nav{flex-direction:column}
}
</style>
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="#/" class="brand">INFOTRINK</a>
    <nav id="navLinks"></nav>
  </div>
</header>

<main id="app"></main>

<script>
/* =========================================================
   DATA (semua contoh, ditandai "Contoh", mudah diganti)
   ========================================================= */

const BOOK_DEFS = [
  ['Gagasan','Gagasan Awal: Ruang Belajar Mandiri'],
  ['Gagasan','Pemikiran Dasar: Dokumentasi Digital'],
  ['Gagasan','Ide Dasar: Arsip Pribadi'],
  ['Gagasan','Konsep Awal: Platform Catatan'],
  ['Perencanaan','Rencana Tahunan: Arah Pengembangan'],
  ['Perencanaan','Perencanaan Proyek: Metode Bertahap'],
  ['Perencanaan','Strategi Dokumentasi: Kerangka Kerja'],
  ['Perencanaan','Peta Jalan: Prioritas Pengembangan'],
  ['Proyek','Proyek Dokumentasi: Catatan Perjalanan'],
  ['Proyek','Proyek Sistem: Arsip Terstruktur'],
  ['Proyek','Proyek Karya: Publikasi Digital'],
  ['Proyek','Proyek Teknologi: Platform INFOTRINK'],
  ['Proses','Proses Perencanaan: Dari Gagasan ke Rencana'],
  ['Proses','Proses Pengerjaan: Tahapan Terarah'],
  ['Proses','Proses Pengujian: Metode Pemeriksaan'],
  ['Proses','Proses Penyempurnaan: Perbaikan Bertahap'],
  ['Hasil','Hasil Pertama: Rangkaian Catatan'],
  ['Hasil','Hasil Tahap Awal: Dokumentasi Terstruktur'],
  ['Hasil','Hasil Pengembangan: Perbaikan Bertahap'],

  if(parts[0]==='' || parts[0]==='home'){ renderHome(); }

  } else {

}

      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function findItem(type, id){
  const sources = {
    buku: books, gagasan: ideas, proyek: projects, proses: processes,
    hasil: results, karya: works, pembelajaran: learnings, arsip: archives,
    rencana: plans, referensi: refs, linimasa: timeline, topik: null
  };
  if(type==='topik'){
    for(const k in topics){ const f = topics[k].find(x=>x.id===id); if(f) return f; }
    return null;
  }
  const list = sources[type];
  if(!list) return null;
  return list.find(x=>x.id===id);
}
function typeLabel(type){
  return ({buku:'Buku Dokumentasi',gagasan:'Gagasan',proyek:'Proyek',proses:'Tahapan Proses',
    hasil:'Hasil',karya:'Karya',pembelajaran:'Pembelajaran',arsip:'Arsip',rencana:'Rencana',
    referensi:'Referensi',linimasa:'Linimasa',topik:'Topik'})[type] || 'Dokumentasi';
}

/* Generic card grid */
function cardGrid(items, type){
  return items.map(it=>`

        <p>${escapeHtml(it.sum||'')}</p>
        <div class="card-status">
          <span><span class="dot ${dotClass(it.status)}"></span>${escapeHtml(it.status||'')}</span>
          <span>${escapeHtml(it.date||'')}</span>
        </div>
      </div>
    </div>
  `).join('');
}
function dotClass(status){
  if(!status) return '';
  const s = status.toLowerCase();
  if(s.includes('selesai')) return 'done';
  if(s.includes('aktif')||s.includes('kembangan')||s.includes('dikaji')) return 'active';
  if(s.includes('rencana')) return 'plan';
  return '';
}

/* Map interactivity */
function initMap(){
  const container = document.getElementById('mapContainer');
  if(!container) return;
  const svg = document.getElementById('mapSvg');
  const hint = document.getElementById('mapHint');
  let selectedL = null;
  let selectedR = null;

  function drawCables(){
    svg.innerHTML = '';
    const cRect = container.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${cRect.width} ${cRect.height}`);
    svg.setAttribute('width', cRect.width);
    svg.setAttribute('height', cRect.height);
    mapConnections.forEach((conn, idx)=>{
      const L = container.querySelector(`[data-map-id="${conn[0]}"]`);
      const R = container.querySelector(`[data-map-id="${conn[1]}"]`);
      if(!L||!R) return;
      const lr = L.getBoundingClientRect();
      const rr = R.getBoundingClientRect();
      const x1 = lr.right - cRect.left;
      const y1 = lr.top + lr.height/2 - cRect.top;
      const x2 = rr.left - cRect.left;
      const y2 = rr.top + rr.height/2 - cRect.top;
      const midX = (x1 + x2) / 2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
      path.setAttribute('fill','none');
      path.setAttribute('stroke','#cbd5e1');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('data-conn', idx);
      path.setAttribute('data-l', conn[0]);
      path.setAttribute('data-r', conn[1]);
      path.setAttribute('data-result', conn[2]);
      path.style.transition = 'stroke .3s, stroke-width .3s';
      svg.appendChild(path);
    });
  }
  function highlightConnections(leftId){
    svg.querySelectorAll('path').forEach(p=>{
      if(leftId && p.getAttribute('data-l') === leftId){
        p.setAttribute('stroke','#3b82f6');
        p.setAttribute('stroke-width','2.5');
      } else {
        p.setAttribute('stroke','#cbd5e1');
        p.setAttribute('stroke-width','1.5');
      }
    });
  }
  function clearResults(){
    document.querySelectorAll('.result-card').forEach(c=>c.classList.remove('active'));
  }
  function resetAll(){
    selectedL = null; selectedR = null;
    container.querySelectorAll('.map-box').forEach(b=>b.classList.remove('active'));
    highlightConnections(null);
    clearResults();
    hint.textContent = 'Belum ada pilihan — pilih kotak di sisi kiri terlebih dahulu.';
  }

  container.querySelectorAll('.map-box').forEach(box=>{
    box.addEventListener('click', ()=>{
      const side = box.getAttribute('data-side');
      const id = box.getAttribute('data-map-id');
      if(side === 'L'){
        // reset right selection
        selectedR = null;
        container.querySelectorAll('[data-side="R"]').forEach(b=>b.classList.remove('active'));
        clearResults();
        container.querySelectorAll('[data-side="L"]').forEach(b=>b.classList.remove('active'));
        box.classList.add('active');
        selectedL = id;
        highlightConnections(id);
        hint.textContent = 'Sisi gagasan dipilih. Sekarang pilih kotak di sisi kanan untuk melihat hubungan.';
      } else {
        if(!selectedL){
          hint.textContent = 'Pilih kotak di sisi kiri terlebih dahulu.';
          return;
        }
        container.querySelectorAll('[data-side="R"]').forEach(b=>b.classList.remove('active'));
        box.classList.add('active');
        selectedR = id;
        const found = mapConnections.find(c=>c[0]===selectedL && c[1]===selectedR);
        clearResults();
        if(found){
          const resultId = found[2];
          const rc = document.querySelector(`[data-result-id="${resultId}"]`);
          if(rc) rc.classList.add('active');
          // highlight specific path
          svg.querySelectorAll('path').forEach(p=>{
            if(p.getAttribute('data-l')===selectedL && p.getAttribute('data-r')===selectedR){
              p.setAttribute('stroke','#2563eb');
              p.setAttribute('stroke-width','3.5');
            }
          });
          hint.textContent = 'Hubungan ditemukan. Kotak hasil yang relevan ditampilkan di bawah.';
        } else {
          hint.textContent = 'Hubungan ini belum tercatat dalam peta.';
        }
      }
    });
  });

  // Klik pada area kosong untuk reset
  document.getElementById('section-2').addEventListener('click', (e)=>{
    if(e.target.id === 'mapHint'){
      resetAll();
    }
  });

  // Render awal & resize
  drawCables();
  setTimeout(drawCables, 100);
  window.addEventListener('resize', ()=>{ drawCables(); });
}

/* Alphabet */
function initAlphabet(){
  const list = document.getElementById('alphaList');
  const nav = document.getElementById('alphaNav');
  if(!list||!nav) return;

  function show(letter){
    nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    const btn = nav.querySelector(`button[data-letter="${letter}"]`);
    if(btn) btn.classList.add('active');
    const items = topics[letter] || [];
    if(!items.length){
      list.innerHTML = `<div class="alpha-empty">Belum ada topik untuk huruf ${letter}.</div>`;
      return;
    }
    list.innerHTML = items.map(it=>`
      <div class="alpha-item" data-detail-type="topik" data-detail-id="${it.id}">
        <h4>${escapeHtml(it.title)}</h4>
        <p>${escapeHtml(it.sum)}</p>
      </div>
    `).join('');
    list.querySelectorAll('.alpha-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const type = el.getAttribute('data-detail-type');
        const id = el.getAttribute('data-detail-id');
        location.hash = '#/detail/'+type+'/'+id;
      });
    });
  }

  nav.querySelectorAll('button').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', ()=> show(btn.getAttribute('data-letter')));
  });

  // Show first available
  const firstActive = nav.querySelector('button.active');
  if(firstActive) show(firstActive.getAttribute('data-letter'));
}

/* Search */
function initSearch(){
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  if(!input||!results) return;

  const allItems = [
    ...books.map(x=>({type:'buku', id:x.id, title:x.title, sum:x.summary, label:'Buku'})),
    ...ideas.map(x=>({type:'gagasan', id:x.id, title:x.title, sum:x.sum, label:'Gagasan'})),
    ...projects.map(x=>({type:'proyek', id:x.id, title:x.title, sum:x.sum, label:'Proyek'})),
    ...results.map(x=>({type:'hasil', id:x.id, title:x.title, sum:x.sum, label:'Hasil'})),
    ...works.map(x=>({type:'karya', id:x.id, title:x.title, sum:x.sum, label:'Karya'})),
    ...learnings.map(x=>({type:'pembelajaran', id:x.id, title:x.title, sum:x.sum, label:'Pembelajaran'})),
    ...archives.map(x=>({type:'arsip', id:x.id, title:x.title, sum:'Arsip '+x.type+' tahun '+x.year, label:'Arsip'})),
    ...plans.map(x=>({type:'rencana', id:x.id, title:x.title, sum:x.sum, label:'Rencana'})),
    ...refs.map(x=>({type:'referensi', id:x.id, title:x.title, sum:x.desc, label:'Referensi'}))
  ];

  function doSearch(q){
    q = q.trim().toLowerCase();
    if(!q){
      results.innerHTML = '<div class="search-empty">Mulai mengetik untuk mencari dokumentasi.</div>';
      return;
    }
    const found = allItems.filter(it =>
      it.title.toLowerCase().includes(q) || it.sum.toLowerCase().includes(q)
    ).slice(0,20);
    if(!found.length){
      results.innerHTML = '<div class="search-empty">Tidak ada dokumentasi yang cocok dengan pencarian.</div>';
      return;
    }
    results.innerHTML = found.map(it=>`
      <div class="search-result" data-search-type="${it.type}" data-search-id="${it.id}">
        <div class="type">${it.label}</div>
        <h5>${escapeHtml(it.title)}</h5>
        <p>${escapeHtml(it.sum)}</p>
      </div>
    `).join('');
    results.querySelectorAll('.search-result').forEach(el=>{
      el.addEventListener('click', ()=>{
        const type = el.getAttribute('data-search-type');
        const id = el.getAttribute('data-search-id');
        location.hash = '#/detail/'+type+'/'+id;
      });
    });
  }

  input.addEventListener('input', e=>doSearch(e.target.value));
}

function sectionForType(type){
