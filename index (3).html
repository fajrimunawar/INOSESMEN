<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infotrink</title>
<meta name="description" content="INFOTRINK — satu wadah untuk perjalanan gagasan dan berbagai karya. Menghimpun informasi dan dokumentasi di beragam bidang, dirangkum dari awal mula hingga pengembangannya.">
<meta name="theme-color" content="#81F6EF">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Open Sans','Segoe UI',Tahoma,sans-serif;
  background:#81F6EF;color:#0B3B3A;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;
}
#container{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;
  background:linear-gradient(180deg,#81F6EF 0%,#9CF4ED 22%,#B2FBF6 45%,#CFFCF6 68%,#E1FFFD 88%,#E8FEFC 100%);
}
/* Saat daftar isi terbuka, kunci scroll agar fokus hanya ke menu daftar isi */
body.menu-locked #container{overflow:hidden}
#wrapper{width:100%;position:relative;overflow:hidden;background:transparent}
#content{position:absolute;top:0;left:0;width:1280px;transform-origin:top left}
@keyframes infotrinkMarqueeHero{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes infotrinkMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.hover-card{transition:transform .2s ease,box-shadow .2s ease}
.hover-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(11,59,58,.12)}
.hover-card-sm{transition:transform .2s ease;text-decoration:none}
.hover-card-sm:hover{transform:translateY(-2px)}
.nav-link{
  font-family:'Open Sans',sans-serif;font-size:15px;font-weight:600;color:#0B3B3A;
  text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;letter-spacing:.2px;
  cursor:pointer;display:inline-block;transition:color .2s ease,border-color .2s ease;
}
.nav-link:hover{color:#0B6E6A}
.nav-link.on{font-weight:700;color:#0B6E6A;border-bottom-color:#0B6E6A}
/* ===== DAFTAR ISI OVERLAY =====
   Garis L selalu mulai dari POSISI nav item sebenarnya (diukur via JS),
   bukan titik klik. Animasi murni CSS via class .open.
   Membuka: titik -> garis -> kotak -> judul -> kartu berurutan -> X.
   Menutup: semua kembali serentak, disembunyikan setelah .9s. */
.overlay-menu{position:absolute;inset:0;visibility:hidden;pointer-events:none;transition:visibility 0s linear .9s}
.overlay-menu.open{visibility:visible;transition-delay:0s}
.overlay-menu.open .ov-box,.overlay-menu.open .ov-x{pointer-events:auto}
.ov-svg{position:absolute;inset:0;pointer-events:none;z-index:20}
.ov-dot-start,.ov-dot-end{
  fill:#0B6E6A;opacity:0;transform:scale(0);transform-origin:center;transform-box:fill-box;
  transition:opacity .25s ease,transform .25s ease;
}
.overlay-menu.open .ov-dot-start{opacity:1;transform:scale(1);transition-delay:.05s}
.ov-line{
  stroke:#0B6E6A;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .45s ease;
}
.overlay-menu.open .ov-line{stroke-dashoffset:0;transition-delay:.1s}
.overlay-menu.open .ov-dot-end{opacity:1;transform:scale(1);transition-delay:.4s}
.ov-box{
  position:absolute;left:70px;top:150px;width:1140px;height:530px;
  background:rgba(255,255,255,0.97);border-radius:0 0 16px 16px;
  box-shadow:0 8px 32px rgba(11,59,58,0.18);z-index:15;padding:36px 44px;overflow:hidden;
  opacity:0;transform:scaleY(0);transform-origin:center top;transition:opacity .4s ease,transform .4s ease;
}
.overlay-menu.open .ov-box{opacity:1;transform:scaleY(1);transition-delay:.25s}
.ov-head{opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease}
.overlay-menu.open .ov-head{opacity:1;transform:translateY(0);transition-delay:.45s}
.ov-h2{font-size:30px;font-weight:800;color:#0B3B3A;margin:0;letter-spacing:-.3px}
.ov-desc{font-size:15px;color:#5B7A78;margin:6px 0 0 0;font-weight:500}
.ov-divider{
  height:2px;background:linear-gradient(90deg,#0B6E6A 0%,rgba(11,110,106,0.1) 100%);
  margin:18px 0 24px 0;opacity:0;transform:scaleX(0);transform-origin:left center;
  transition:opacity .25s ease,transform .35s ease;
}
.overlay-menu.open .ov-divider{opacity:1;transform:scaleX(1);transition-delay:.5s}
.ov-cards{display:flex;gap:14px;flex-wrap:wrap}
.ov-card{
  width:182px;padding:18px 16px;background:linear-gradient(135deg,#F0FAF8 0%,#DCF3EC 100%);
  border-radius:12px;border:1px solid rgba(11,110,106,0.12);
  opacity:0;transform:translateY(20px);transition:opacity .35s ease,transform .35s ease;
}
.overlay-menu.open .ov-card{opacity:1;transform:translateY(0);transition-delay:var(--d,0s)}
.ov-num{display:inline-block;font-size:11px;font-weight:700;color:#0B6E6A;background:rgba(11,110,106,0.1);padding:3px 8px;border-radius:6px;margin-bottom:10px;letter-spacing:.5px}
.ov-title{font-size:15px;font-weight:700;color:#0B3B3A;min-height:38px;line-height:1.3}
.ov-btn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:#0B6E6A;color:#fff;
  border:none;border-radius:999px;font-family:'Open Sans',sans-serif;font-size:11px;font-weight:700;
  cursor:pointer;margin-top:12px;letter-spacing:.3px;transition:background .2s ease,transform .2s ease;text-decoration:none;
}
.ov-btn:hover{background:#0B3B3A;transform:translateX(2px)}
.ov-x{
  position:absolute;left:1154px;top:166px;width:38px;height:38px;border-radius:50%;
  background:#0B3B3A;color:#fff;border:none;font-family:'Open Sans',sans-serif;font-size:16px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:18;
  opacity:0;transform:scale(0) rotate(-90deg);box-shadow:0 4px 12px rgba(11,59,58,0.25);
  transition:opacity .25s ease,transform .25s ease,background .2s ease;
}
.overlay-menu.open .ov-x{opacity:1;transform:scale(1) rotate(0deg);transition-delay:.55s}
.overlay-menu.open .ov-x:hover{background:#d32f2f;transform:scale(1.1) rotate(0deg);transition-delay:0s}
.hero-dim{transition:opacity .3s ease}
.slide-root.menu-open .hero-dim{opacity:.22;pointer-events:none}
</style>
</head>
<body>
<main id="container">
  <div id="wrapper">
    <div id="content"></div>
  </div>
</main>
<script>
(function(){
"use strict";

var state = { view:'beranda', activeMenu:null, lastActiveMenu:null, scale:0, contentHeight:0, navPositions:{} };

var NAV_ITEMS = ["Beranda","Publikasi","Informasi","Galeri","Mengenal INFOTRINK"];
var SUB_MENUS = {
  Publikasi:{ description:"Pusat seluruh konten yang diterbitkan.", items:["Media Informasi & Penjelasan","Hasil Riset dan Penelitian","Kajian dan Analisis","Laporan & Catatan Perkembangan","Data dan Referensi","Gagasan & Konsep Pengembangan"] },
  Informasi:{ description:"Pengelompokan informasi berdasarkan bidang.", items:["Media Digital","Pembangunan","Personal","Bidang lainnya"] },
  Galeri:{ description:"Arsip visual dan dokumentasi.", items:["Dokumentasi riset","Dokumentasi media digital","Dokumentasi pembangunan","Dokumentasi personal","Visual dan infografis"] },
  "Mengenal INFOTRINK":{ description:"Menjelaskan konsep dan keberadaan INFOTRINK sebagai sebuah wadah, bukan profil perusahaan atau lembaga.", items:["Pengenalan INFOTRINK","Latar Belakang","Tujuan dan Fungsi","Ruang Lingkup","Prinsip Pengelolaan"] }
};
var NAV_X = { Beranda:820, Publikasi:910, Informasi:1000, Galeri:1085, "Mengenal INFOTRINK":1190 };
var LINE_START_Y=78, LINE_TURN_Y=150, BOX_LEFT=70;
var MARQUEE_WORDS=["BERKEMBANG","KETERAMPILAN","KETEKUNAN","KERJA KERAS","KONSISTEN","KEMAJUAN","KEBERHASILAN","PERJUANGAN","TEKAD"];
var HERO_MARQUEE_ITEMS=["Instagram @jri_munawar","Twitter @Jri_munawar","Bagian dari jaringan JRI MUNAWAR GROUP"];

function brandText(text){
  if(text==null) return "";
  text=String(text);
  if(text.indexOf("INFOTRINK")===-1) return escapeHtml(text);
  var parts=text.split("INFOTRINK");
  var out="";
  for(var i=0;i<parts.length;i++){ out+=escapeHtml(parts[i]); if(i<parts.length-1) out+='<span translate="no">INFOTRINK</span>'; }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s){ return escapeHtml(s); }
function S(o){
  var out=[];
  for(var k in o){
    if(o[k]==null) continue;
    var v=o[k];
    if(typeof v==='number' && k!=='opacity' && k!=='zIndex' && k!=='fontWeight' && k!=='lineHeight' && k!=='flexGrow' && k!=='flexShrink' && k!=='zoom') v=v+'px';
    var kk=k.replace(/[A-Z]/g,function(m){return '-'+m.toLowerCase();});
    out.push(kk+':'+v);
  }
  return out.join(';');
}
function getSlide(){ return document.querySelector('[data-slide-content]'); }
function ovSelector(menuKey){ return '.overlay-menu[data-menu="'+menuKey+'"]'; }

var ICONS = {
  Lightbulb:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>',
  Compass:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
  PenLine:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  Flag:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>',
  Workflow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg>',
  Archive:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>',
  TrendingUp:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>'
};

function renderHeader(){
  var navLinks='';
  for(var i=0;i<NAV_ITEMS.length;i++){
    var item=NAV_ITEMS[i];
    if(item==="Beranda"){
      navLinks+='<a class="nav-link" href="#" data-nav="Beranda" onclick="return IFTRK.navBeranda(event)">'+brandText("Beranda")+'</a>';
    } else {
      navLinks+='<a class="nav-link" href="#" data-nav="'+escapeAttr(item)+'" onclick="return IFTRK.navClick(\''+escapeAttr(item)+'\', event)">'+brandText(item)+'</a>';
    }
  }
  return '<header style="'+S({position:"absolute",top:"32px",left:"70px",right:"70px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:10})+'">'
    +'<a href="#" onclick="return IFTRK.navBeranda(event)" style="'+S({display:"flex",alignItems:"center",gap:"12px",padding:"8px 22px 8px 10px",background:"rgba(255,255,255,0.85)",backdropFilter:"blur(10px)",borderRadius:"999px",boxShadow:"0 4px 16px rgba(11,59,58,0.12)",border:"1px solid rgba(255,255,255,0.6)",textDecoration:"none"})+'">'
    +'<img src="slide/logo_icon.png" alt="Infotrink logo" style="'+S({width:"42px",height:"42px",objectFit:"contain",display:"block",filter:"drop-shadow(0 2px 4px rgba(11,59,58,0.15))"})+'">'
    +'<img src="slide/logo_text.png" alt="Infotrink" style="'+S({width:"125px",height:"40px",objectFit:"contain",display:"block"})+'">'
    +'</a><nav style="'+S({display:"flex",alignItems:"center",gap:"32px",padding:"10px 26px",background:"rgba(255,255,255,0.55)",backdropFilter:"blur(8px)",borderRadius:"999px",boxShadow:"0 4px 16px rgba(11,59,58,0.10)"})+'">'+navLinks+'</nav></header>';
}

function renderOverlay(menuKey){
  var menuData=SUB_MENUS[menuKey];
  var navX = state.navPositions[menuKey]!=null ? state.navPositions[menuKey] : NAV_X[menuKey];
  var linePath="M "+navX+" "+LINE_START_Y+" L "+navX+" "+LINE_TURN_Y+" L "+BOX_LEFT+" "+LINE_TURN_Y;
  var cards='';
  for(var i=0;i<menuData.items.length;i++){
    var item=menuData.items[i];
    var delay=(0.55+i*0.06).toFixed(2);
    cards+='<div class="ov-card" style="--d:'+delay+'s">'
      +'<span class="ov-num">'+String(i+1).padStart(2,'0')+'</span>'
      +'<div class="ov-title">'+brandText(item)+'</div>'
      +'<a class="ov-btn" href="#" onclick="return false">Telusuri \u2192</a>'
      +'</div>';
  }
  return '<div class="overlay-menu" data-menu="'+escapeAttr(menuKey)+'">'
    +'<svg class="ov-svg" width="1280" height="720">'
    +'<circle class="ov-dot-start" cx="'+navX+'" cy="'+LINE_START_Y+'" r="5"></circle>'
    +'<path class="ov-line" d="'+linePath+'" pathLength="1"></path>'
    +'<circle class="ov-dot-end" cx="'+BOX_LEFT+'" cy="'+LINE_TURN_Y+'" r="5"></circle>'
    +'</svg>'
    +'<div class="ov-box">'
    +'<div class="ov-head"><h2 class="ov-h2">'+brandText(menuKey)+'</h2><p class="ov-desc">'+brandText(menuData.description)+'</p></div>'
    +'<div class="ov-divider"></div>'
    +'<div class="ov-cards">'+cards+'</div>'
    +'</div>'
    +'<button class="ov-x" onclick="IFTRK.closeOverlay()" aria-label="Tutup daftar isi">\u2715</button>'
    +'</div>';
}
function renderAllOverlays(){
  var out=''; for(var k in SUB_MENUS){ out+=renderOverlay(k); } return out;
}

function renderHero(){
  return '<div data-slide-content class="slide-root" style="'+S({position:"relative",width:"1280px",height:"720px",overflow:"hidden",background:"linear-gradient(180deg, #81F6EF 0%, #9CF4ED 22%, #B2FBF6 45%, #CFFCF6 68%, #E1FFFD 88%, #E8FEFC 100%)",fontFamily:"'Open Sans', 'Segoe UI', Tahoma, sans-serif"})+'">'
    +'<div class="hero-dim">'
    +renderHeader()
    +'<div style="'+S({position:"absolute",left:"70px",top:"150px",width:"560px",zIndex:5})+'">'
    +'<h1 style="'+S({fontFamily:"'Open Sans', sans-serif",fontWeight:800,fontSize:"32px",lineHeight:1.3,color:"#0B3B3A",letterSpacing:"-0.5px",textTransform:"uppercase",margin:0,textAlign:"left"})+'">Satu Wadah untuk Perjalanan<br>Gagasan dan Berbagai Karya</h1>'
    +'<div style="'+S({display:"flex",alignItems:"flex-start",marginTop:"44px",gap:"10px"})+'">'
    +'<img src="slide/quote.svg" alt="" width="48" height="34" style="'+S({flexShrink:0,width:"48px",height:"34px",marginTop:"-12px",userSelect:"none"})+'">'
    +'<p style="'+S({fontFamily:"'Open Sans', sans-serif",fontWeight:400,fontSize:"16.5px",lineHeight:1.6,color:"#1F2937",textAlign:"justify",textJustify:"inter-word",width:"470px",margin:0})+'">INFOTRINK menghimpun informasi dan dokumentasi di beragam bidang, dirangkum mulai dari awal mula, perencanaan, sampai perwujudan dan pengembangannya \u2014 semuanya tertata rapi dan terus diperbarui, sehingga perjalanan di balik setiap gagasan dan karya dapat dikenali dengan jelas.</p>'
    +'</div>'
    +'<div style="'+S({display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"52px",marginLeft:"58px",width:"470px"})+'">'
    +'<a href="#" onclick="return false" style="'+S({position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"flex-end",height:"44px",width:"auto",paddingRight:"40px",paddingLeft:"60px",cursor:"pointer",textDecoration:"none"})+'">'
    +'<img src="slide/button2.png" alt="Tombol Telusuri" style="'+S({position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"fill",display:"block",zIndex:0})+'">'
    +'<span style="'+S({position:"relative",zIndex:1,fontFamily:"'Open Sans', sans-serif",fontSize:"16px",fontWeight:700,color:"#1a1a1a",letterSpacing:"0.3px",pointerEvents:"none"})+'">Telusuri</span></a>'
    +'<a href="#" onclick="return false" style="'+S({position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"flex-start",height:"44px",width:"auto",paddingLeft:"40px",paddingRight:"60px",cursor:"pointer",textDecoration:"none"})+'">'
    +'<img src="slide/button1.png" alt="Tombol Kenali" style="'+S({position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"fill",display:"block",zIndex:0})+'">'
    +'<span style="'+S({position:"relative",zIndex:1,fontFamily:"'Open Sans', sans-serif",fontSize:"16px",fontWeight:700,color:"#1a1a1a",letterSpacing:"0.3px",pointerEvents:"none"})+'">Kenali</span></a>'
    +'</div>'
    +'<div aria-label="Instagram @jri_munawar, Twitter @Jri_munawar, Bagian dari jaringan JRI MUNAWAR GROUP" style="'+S({marginTop:"44px",marginLeft:"58px",width:"470px",padding:"10px 0",background:"rgba(11,110,106,0.07)",borderRadius:"999px",border:"1px solid rgba(11,110,106,0.22)",overflow:"hidden",whiteSpace:"nowrap",WebkitMaskImage:"linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%)",maskImage:"linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%)"})+'">'
    +'<div style="'+S({display:"inline-flex",alignItems:"center",animation:"infotrinkMarqueeHero 40s linear infinite",willChange:"transform"})+'">'+heroMarqueeInner()+heroMarqueeInner(true)+'</div></div>'
    +'</div>'
    +'<div style="'+S({position:"absolute",left:"660px",top:"150px",width:"550px",height:"555px",zIndex:3})+'">'
    +renderPhoto(0,0,"slide/hero_studio_kreatif.jpg","Tim kreatif berkolaborasi mengelola konten media digital di ruang kerja")
    +renderPhoto(20,294,"slide/hero_4_narasumber.jpg","Narasumber menyampaikan penjelasan saat sesi wawancara")
    +renderPhoto(279,0,"slide/hero_berbagi_sesama.jpg","Relawan menyerahkan bantuan kepada warga dalam kegiatan berbagi bersama")
    +renderPhoto(299,294,"slide/hero_pembangunan.jpg","Petugas memeriksa denah pembangunan di lokasi proyek konstruksi")
    +'</div></div>'+renderAllOverlays()+'</div>';
}
function heroMarqueeInner(second){
  var reps='';
  for(var rep=0;rep<2;rep++){
    for(var i=0;i<HERO_MARQUEE_ITEMS.length;i++){
      reps+='<span style="'+S({display:"inline-flex",alignItems:"center"})+'">'
        +'<span style="'+S({fontSize:"12px",fontWeight:600,letterSpacing:"2px",color:"rgba(11,110,106,0.85)",padding:"0 22px",whiteSpace:"nowrap"})+'">'+escapeHtml(HERO_MARQUEE_ITEMS[i])+'</span>'
        +'<span style="'+S({color:"rgba(11,110,106,0.4)",fontSize:"11px",margin:"0 5px"})+'">\u2022</span></span>';
    }
  }
  return '<div'+(second?' aria-hidden="true"':'')+' style="'+S({display:"inline-flex",alignItems:"center"})+'">'+reps+'</div>';
}
function renderPhoto(top,left,src,alt){
  return '<div style="'+S({position:"absolute",top:top,left:left,width:"256px",height:"256px"})+'">'
    +'<div style="'+S({position:"absolute",top:"18px",left:"-18px",width:"100%",height:"100%",background:"linear-gradient(135deg, #0B6E6A 0%, #5B7A78 100%)",borderRadius:"18px",opacity:0.3})+'"></div>'
    +'<div style="'+S({position:"relative",width:"100%",height:"100%",padding:"8px",background:"linear-gradient(155deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.36) 55%, rgba(129,246,239,0.38) 100%)",border:"1px solid rgba(255,255,255,0.7)",borderRadius:"18px",boxShadow:"0 8px 22px rgba(11,59,58,0.12)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)"})+'">'
    +'<img src="'+escapeAttr(src)+'" alt="'+escapeAttr(alt)+'" width="240" height="240" loading="eager" style="'+S({width:"240px",height:"240px",objectFit:"cover",borderRadius:"12px",display:"block"})+'">'
    +'</div></div>';
}

function renderBerandaSections(){
  return '<div style="'+S({position:"absolute",top:"720px",left:0,width:"1280px"})+'">'
    +renderSectionPengenalanSingkat()+renderSectionAlurPerjalanan()+renderSectionKutipanSemangat()+renderSectionPenutup()
    +'</div>';

function updateNavHighlight(){
  var slide=getSlide(); if(!slide) return;
  var links=slide.querySelectorAll('.nav-link');
  for(var i=0;i<links.length;i++){
    var item=links[i].getAttribute('data-nav');
    var isActive=state.activeMenu===item;
    var isLastActive=!state.activeMenu && state.lastActiveMenu===item;
    var isDefaultBeranda=item==="Beranda" && !state.activeMenu && !state.lastActiveMenu;
    links[i].classList.toggle('on', !!(isActive||isLastActive||isDefaultBeranda));
  }
}
function navBeranda(ev){
  if(ev) ev.preventDefault();
  if(state.activeMenu) closeOverlay();
  scrollTop();
  return false;
}
function navClick(item, ev){
  if(ev) ev.preventDefault();
  var slide=getSlide(); if(!slide) return false;
  if(state.activeMenu===item){ closeOverlay(); return false; }
  if(state.activeMenu){ var oldOv=slide.querySelector(ovSelector(state.activeMenu)); if(oldOv) oldOv.classList.remove('open'); }
  measureNavPositions();
  state.activeMenu=item; state.lastActiveMenu=item;
  var ov=slide.querySelector(ovSelector(item));
  if(ov) ov.classList.add('open');
  slide.classList.add('menu-open');
  document.body.classList.add('menu-locked');
  updateNavHighlight();
  return false;
}
function closeOverlay(){
  if(!state.activeMenu) return;
  var slide=getSlide();
  if(slide){ var ov=slide.querySelector(ovSelector(state.activeMenu)); if(ov) ov.classList.remove('open'); slide.classList.remove('menu-open'); }
  document.body.classList.remove('menu-locked');
  state.activeMenu=null;
  updateNavHighlight();
}

  var content=document.getElementById('content'); if(!content) return;
  var actualHeight=content.scrollHeight*state.scale;
  if(actualHeight>0){ state.contentHeight=actualHeight; var wrapper=document.getElementById('wrapper'); if(wrapper) wrapper.style.height=actualHeight+'px'; }
}
function measureNavPositions(){
  var slideEl=getSlide(); if(!slideEl) return;
  var slideRect=slideEl.getBoundingClientRect();
  var currentScale=slideRect.width/1280; if(currentScale===0) return;
  var positions={};
  var navEls=slideEl.querySelectorAll('[data-nav]');
  for(var i=0;i<navEls.length;i++){
    var navEl=navEls[i]; var item=navEl.getAttribute('data-nav');
    var navRect=navEl.getBoundingClientRect();
    positions[item]=(navRect.left+navRect.width/2-slideRect.left)/currentScale;
  }
  state.navPositions=positions;
  updateOverlayPositions();
}
function updateOverlayPositions(){
  var slideEl=getSlide(); if(!slideEl) return;
  var overlays=slideEl.querySelectorAll('.overlay-menu');
  for(var i=0;i<overlays.length;i++){
    var menuKey=overlays[i].getAttribute('data-menu');
    var navX=state.navPositions[menuKey]!=null?state.navPositions[menuKey]:NAV_X[menuKey];
    var linePath="M "+navX+" "+LINE_START_Y+" L "+navX+" "+LINE_TURN_Y+" L "+BOX_LEFT+" "+LINE_TURN_Y;
    var path=overlays[i].querySelector('path'); if(path) path.setAttribute('d',linePath);
    var circles=overlays[i].querySelectorAll('circle'); if(circles.length>=1) circles[0].setAttribute('cx',navX);
  }
}

function mount(html){
  var content=document.getElementById('content');
  content.innerHTML=html;
  applyZoom();
  updateNavHighlight();
  requestAnimationFrame(function(){ measureContentHeight(); measureNavPositions(); });
}
function boot(){
  updateScale();
  state.view='beranda'; state.activeMenu=null; state.lastActiveMenu=null;
  mount(renderHero()+renderBerandaSections());
  window.addEventListener('resize',function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); });
  window.addEventListener('orientationchange',function(){ setTimeout(function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); },100); });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ measureNavPositions(); }); }
  setTimeout(function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); },100);
  setTimeout(function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); },500);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && state.activeMenu) closeOverlay(); });
  var content=document.getElementById('content');
  if(content && typeof MutationObserver!=='undefined'){
    var mo=new MutationObserver(function(){ requestAnimationFrame(measureContentHeight); });
    mo.observe(content,{childList:true,subtree:true,characterData:true});
  }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }
})();
</script>
