<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perkembangan dalam satu gagasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --a1: 201, 161, 91;    /* warna utama (emas) */
    --a2: 130, 150, 210;   /* warna aksen dingin */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #08080b;
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }

  /* ===== BACKGROUND ===== */
  .dasar {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 100% at 50% 0%, #14141a 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0e 0%, #08080b 100%);
  }
  .paralaks { position: fixed; inset: -6%; will-change: transform; }
  .putar {
    position: absolute; left: 50%; top: 50%;
    width: 140vmax; height: 140vmax;
    margin: -70vmax 0 0 -70vmax;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgba(var(--a1), .10) 55deg, transparent 115deg,
      rgba(var(--a2), .07) 185deg, transparent 245deg,
      rgba(var(--a1), .07) 315deg, transparent 360deg);
    filter: blur(40px);
    animation: berputar 70s linear infinite;
  }
  @keyframes berputar { to { transform: rotate(360deg); } }
  .cincin {
    position: absolute; left: 50%; top: 50%;
    width: 160vmax; height: 160vmax;
    margin: -80vmax 0 0 -80vmax;
    border-radius: 50%;
    background: repeating-radial-gradient(circle,
      rgba(var(--a1), .05) 0, rgba(var(--a1), .05) 1px,
      transparent 1px, transparent 9vmax);
    -webkit-mask-image: radial-gradient(circle,
      transparent 14%, rgba(0,0,0,.8) 26%,
      rgba(0,0,0,.6) 45%, transparent 72%);
    mask-image: radial-gradient(circle,
      transparent 14%, rgba(0,0,0,.8) 26%,
      rgba(0,0,0,.6) 45%, transparent 72%);
    animation: napasCincin 18s ease-in-out infinite alternate;
  }
  @keyframes napasCincin { to { transform: scale(1.04); } }
  .cahaya-pusat {
    position: fixed; left: 50%; top: 50%;
    width: 90vmax; height: 90vmax;
    margin: -45vmax 0 0 -45vmax;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(var(--a1), .09) 0%, rgba(var(--a1), .03) 35%, transparent 60%);
    filter: blur(30px);
    animation: napas 12s ease-in-out infinite alternate;
  }
  @keyframes napas { to { opacity: .55; } }
  .sorot { position: fixed; width: 220vmax; height: 24vmax; filter: blur(30px); }
  .sorot1 {
    top: -4vmax; left: -60vmax; transform: rotate(-16deg);
    background: linear-gradient(90deg, transparent,
      rgba(var(--a2), .06) 35%, rgba(255,255,255,.05) 50%, transparent 65%);
    animation: arung1 24s ease-in-out infinite alternate;
  }
  .sorot2 {
    bottom: -6vmax; right: -60vmax; transform: rotate(-14deg);
    background: linear-gradient(90deg, transparent,
      rgba(var(--a1), .06) 40%, transparent 70%);
    animation: arung2 30s ease-in-out infinite alternate;
  }
  @keyframes arung1 { to { transform: rotate(-16deg) translateX(8vmax); } }
  @keyframes arung2 { to { transform: rotate(-14deg) translateX(-8vmax); } }
  #grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.55) 100%);
  }

  /* ===== JUDUL + SUBJUDUL ===== */
  .judul {
    position: fixed; inset: 0; z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 4vw;                 /* ← diprapatkan: sisa 4% tiap sisi aja */
  }
  .judul h1 {
    font-size: clamp(2rem, 5vw, 4.5rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    line-height: 1.15;
    white-space: nowrap;
    background: linear-gradient(180deg, #f7f0dd 15%, #d9c08a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 26px rgba(0,0,0,.65));
    animation: muncul 1.4s ease both;
  }
  @keyframes muncul { from { opacity: 0; transform: translateY(18px); } }

  /* ===== SUBJUDUL — MENTOK KIRI & KANAN ===== */
  .subjudul {
    margin-top: 2.6rem;
    width: 100%;                        /* ← lebar penuh sampai mentok */
    font-family: 'Inter', 'Segoe UI', sans-serif;
    font-weight: 300;
    font-size: clamp(1rem, 1.6vw, 1.35rem);   /* dikit lebih gede biar seimbang */
    line-height: 2;
    letter-spacing: .02em;
    color: rgba(226, 220, 204, .75);
    text-shadow: 0 2px 20px rgba(0,0,0,.5);
    text-align: justify;                /* RATA KANAN-KIRI mentok */
    text-align-last: center;            /* baris sisa → ke TENGAH */
    hyphens: auto;                      /* kata panjang dipotong rapi */
    animation: muncul 1.4s .4s ease both;
  }
</style>
</head>
<body>

  <div class="dasar"></div>

  <div class="paralaks">
    <div class="putar"></div>
    <div class="cincin"></div>
  </div>

  <div class="cahaya-pusat"></div>
  <div class="sorot sorot1"></div>
  <div class="sorot sorot2"></div>

  <svg id="grain">
    <filter id="fgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#fgrain)" opacity="0.05"/>
  </svg>
  <div class="vignette"></div>

  <div class="judul">
    <h1 id="teks">Perkembangan dalam satu gagasan</h1>
    <p class="subjudul">Kami menghadirkan satu wadah bagi bertumbuhnya gagasan,
    gerakan, dan karya — merangkai setiap langkah menuju perekonomian yang kuat,
    mandiri, dan berkelanjutan demi masa depan yang lebih baik bersama.</p>
  </div>

  <script>
  /* ===== TEMA WARNA (tekan 1–4) ===== */
  const tema = [
    { a1: '201,161,91',  a2: '130,150,210' },
    { a1: '205,215,230', a2: '150,170,205' },
    { a1: '80,170,140',  a2: '110,190,200' },
    { a1: '196,124,92',  a2: '170,140,120' }
  ];
  const lapisan = [
    document.querySelector('.paralaks'),
    document.querySelector('.cahaya-pusat'),
    ...document.querySelectorAll('.sorot')
  ];
  function ganti(i) {
    lapisan.forEach(el => { el.style.transition = 'opacity .25s'; el.style.opacity = .25; });
    setTimeout(() => {
      for (const k in tema[i])
        document.documentElement.style.setProperty('--' + k, tema[i][k]);
      lapisan.forEach(el => el.style.opacity = '');
    }, 250);
  }
  addEventListener('keydown', e => {
    const n = parseInt(e.key);
    if (n >= 1 && n <= 4) ganti(n - 1);
  });

  /* ===== PARALLAX ===== */
  const paralaks = document.querySelector('.paralaks');
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => {
    tx = e.clientX / innerWidth  - .5;
    ty = e.clientY / innerHeight - .5;
  });
  (function loop() {
    cx += (tx - cx) * .04;
    cy += (ty - cy) * .04;
    paralaks.style.transform = `translate(${cx * 14}px, ${cy * 10}px)`;
    requestAnimationFrame(loop);
  })();

  /* ===== PENYESUAI OTOMATIS UKURAN JUDUL ===== */
  const h1 = document.getElementById('teks');
  const pengukur = document.createElement('span');
  pengukur.style.cssText =
    'position:absolute;visibility:hidden;white-space:nowrap;pointer-events:none;';
  document.body.appendChild(pengukur);

  function pasUkuran() {
    h1.style.fontSize = '';
    const cs = getComputedStyle(h1);
    pengukur.style.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    pengukur.style.letterSpacing = cs.letterSpacing;
    pengukur.style.textTransform = cs.textTransform;
    pengukur.textContent = h1.textContent;

    const lebarTeks = pengukur.getBoundingClientRect().width;
    const maksLebar = window.innerWidth * 0.88;

    if (lebarTeks > maksLebar) {
      const skala = maksLebar / lebarTeks;
      h1.style.fontSize = (parseFloat(cs.fontSize) * skala) + 'px';
    }
  }
  addEventListener('load', pasUkuran);
  addEventListener('resize', pasUkuran);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(pasUkuran);
  pasUkuran();
  </script>
</body>
</html>
