<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Menonaktifkan scroll */
            background: #080808; /* Latar dasar hitam pekat */
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animasi Latar Belakang Organik (Bukan Kotak) */
        .bg-art {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #bf953f, transparent);
            top: -10%;
            left: -10%;
            animation: drift1 15s infinite alternate ease-in-out;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #1a237e, transparent);
            bottom: -15%;
            right: -10%;
            animation: drift2 18s infinite alternate ease-in-out;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #b71c1c, transparent);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: drift3 12s infinite alternate ease-in-out;
        }

        @keyframes drift1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        @keyframes drift2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-80px, -40px) scale(1.1); }
        }

        @keyframes drift3 {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            100% { transform: translate(-30%, -60%) scale(1.5); opacity: 0.6; }
        }

        /* Tata Letak Teks Mengambang */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        /* Judul Utama */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 6.5rem); /* Responsif terhadap lebar layar */
            font-weight: 700;
            letter-spacing: 10px;
            line-height: 1.1;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff 20%, #bf953f 40%, #fcf6ba 50%, #bf953f 60%, #fff 80%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(191, 149, 63, 0.3);
            margin-bottom: 40px;
        }

        /* Garis Pemisah Elegan */
        .separator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .line {
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #bf953f, transparent);
        }

        .diamond {
            width: 6px;
            height: 6px;
            background: #bf953f;
            transform: rotate(45deg);
        }

        /* Teks Hak Cipta */
        .copyright {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

    </style>
</head>
<body>

    <!-- Bentukan Latar Belakang Organik -->
    <div class="bg-art">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Konten Teks Mengambang -->
    <div class="content-wrapper">
        <h1>Integrasi Dasbor</h1>
        
        <div class="separator">
            <div class="line"></div>
            <div class="diamond"></div>
            <div class="line"></div>
        </div>

        <div class="copyright">Hak Cipta &copy; 2024</div>
    </div>

</body>
</html>
