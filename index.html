<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFOTRINK — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1712;
    --ink-soft:rgba(28,23,18,.5);
    --paper:#f2eee4;
    --accent:#b23a25;
    --serif:'Fraunces',serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);overflow:hidden;font-family:var(--serif)}

  /* butiran kertas halus */
  .grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");}

  #scene{position:fixed;inset:0}

  /* ================= LOADING ================= */
  .pf-scene{position:absolute;inset:0;background:var(--paper);overflow:hidden;cursor:pointer}

  /* ---- judul: wordmark berwibawa ---- */
  .pf-title{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:20px;z-index:2;pointer-events:none;
    transition:opacity .9s ease,transform .9s ease}
  .pf-scene.titleout .pf-title{opacity:0;transform:translate(-50%,-54%)}

  .t-kicker{font:500 10px var(--mono);letter-spacing:.52em;padding-left:.52em;
    color:var(--ink-soft);opacity:0;animation:kIn .9s .1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes kIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .t-word{white-space:nowrap;letter-spacing:.34em;padding-left:.34em;
    animation:trackIn 1.7s .25s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes trackIn{from{letter-spacing:.34em;padding-left:.34em}to{letter-spacing:.17em;padding-left:.17em}}
  .t-letter{display:inline-block;font:600 clamp(2rem,7.5vw,4.9rem)/1 var(--serif);
    color:var(--ink);opacity:0;transform:translateY(22px);filter:blur(8px);
    animation:tIn .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.25s + var(--d)*.075s)}
  @keyframes tIn{to{opacity:1;transform:none;filter:none}}

  .t-orn{display:flex;align-items:center;gap:14px;opacity:0;transform:scaleX(.5);
    animation:ornIn .8s 1.15s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ornIn{to{opacity:1;transform:none}}
  .t-orn .ln{width:72px;height:1px;background:rgba(28,23,18,.35)}
  .t-orn .dm{width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}

  /* ---- strip galeri ---- */
  .pf-rows{position:absolute;left:0;right:0;top:66%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:10px;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);
    mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}
  .pf-row{display:flex;width:max-content;will-change:transform}
  .pf-set{display:flex;gap:10px;padding-right:10px}
  .pf-row img{height:100px;width:150px;object-fit:cover;filter:grayscale(1);opacity:.18;
    transform:translateY(6px) scale(.98);transition:filter .6s,opacity .6s,transform .6s}
  .pf-row img.on{filter:none;opacity:1;transform:none}
  /* foto duplikat (untuk loop mulus) disembunyikan sampai strip siap berjalan */
  .pf-scene:not(.run) .pf-row img.dup{opacity:0}

  .veil{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;background:var(--paper)}
  .veil.on{animation:veilIn .8s ease forwards}
  @keyframes veilIn{to{opacity:1}}

  @media (max-width:560px){
    .pf-row img{height:76px;width:114px}
    .t-orn .ln{width:48px}
  }
  @media (prefers-reduced-motion:reduce){
    .t-letter,.t-word,.t-orn,.t-kicker{animation-duration:.01s;animation-delay:0s}
  }
</style>
</head>
<body>

  <div id="scene"></div>
  <div class="grain"></div>

<script>
(() => {
  const scene   = document.getElementById('scene');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= LOADING — berulang otomatis ================= */
  let runToken = 0;

  function buildLoading(){
    const token = ++runToken;
    scene.innerHTML = '';

    const el = document.createElement('div');
    el.className = 'pf-scene';

    const letters = 'INFOTRINK'.split('').map((c, i) =>
      `<span class="t-letter" style="--d:${i}">${c}</span>`).join('');
    const img = (r, n) => `<img src="https://picsum.photos/seed/itk-${r}-${n}/300/200.jpg" alt="">`;
    const set = r => `<div class="pf-set">${Array.from({length:8}, (_, n) => img(r, n)).join('')}</div>`;

    el.innerHTML = `
      <div class="pf-rows">
        <div class="pf-row">${set(1)}${set(1)}</div>
        <div class="pf-row">${set(2)}${set(2)}</div>
      </div>
      <div class="pf-title">
        <div class="t-kicker">MEDIA INFORMASI &amp; TRIK</div>
        <h1 class="t-word">${letters}</h1>
        <div class="t-orn"><span class="ln"></span><span class="dm"></span><span class="ln"></span></div>
      </div>`;
    scene.appendChild(el);

    const rows = [...el.querySelectorAll('.pf-row')];
    const imgs = [...el.querySelectorAll('.pf-row img')];

    // foto duplikat (set kedua tiap baris) ditandai — muncul saat strip mulai berjalan
    rows.forEach(r => [...r.querySelectorAll('img')].slice(8).forEach(im => im.classList.add('dup')));

    const timers = new Set();
    const queue = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); if(token === runToken) fn(); }, ms); timers.add(t); };

    /* ---------- gerak strip: masuk satu-satu → berjalan → keluar ----------
       Fase 1 (masuk) : ATAS — foto dibagikan satu per satu DARI TEPI KANAN,
                        meluncur ke kiri menuju slotnya. BAWAH — dari tepi
                        kiri, meluncur ke kanan. Keduanya mulai & selesai
                        bersamaan (~2 detik, pelan dan berkelas).
       Fase 2 (jalan) : marquee pelan — atas ke kiri, bawah ke kanan,
                        foto menyala satu per satu sampai galeri lengkap.
       Fase 3 (keluar): setelah galeri lengkap, strip akselerasi keluar
                        sesuai arah jalurnya masing-masing.                */
    const W = rows[0].querySelector('.pf-set').offsetWidth;   // lebar satu set
    const rowImgs = rows.map(r => [...r.querySelectorAll('img')]);

    // posisi awal baris: satu set foto di tengah layar (titik sambung fase jalan)
    const txEnt = Math.round((innerWidth - W) / 2);
    rows.forEach(r => r.style.transform = `translateX(${txEnt}px)`);

    let phase = 'enter';
    let o = [0, 0];
    const BASE = 26;
    let speed = [BASE, BASE];
    let exitDone = 0, gone = false;
    let last = performance.now();

    /* ---- fase 1: bagikan foto satu per satu ---- */
    const FLIGHT = 650, STAG = 130, ENTER_DELAY = 450;

    if(reduced){
      // tanpa animasi masuk: langsung siap di posisi
      phase = 'run'; el.classList.add('run');
      o[0] = ((-txEnt % W) + W) % W;
      o[1] = ((txEnt + W) % W + W) % W;
    } else {
      // pasang keadaan awal tiap foto: tersembunyi di luar layar sesuai sisi barisnya
      rowImgs.forEach((ims, ri) => {
        ims.slice(0, 8).forEach((im, k) => {
          const order = ri === 0 ? k : (7 - k);          // bawah diisi dari ujung kanan dulu
          const slotLeft = txEnt + im.offsetLeft;
          const dx = ri === 0
            ? (innerWidth + 80 - slotLeft)               // atas: mulai di luar tepi KANAN
            : -(slotLeft + im.offsetWidth + 80);         // bawah: mulai di luar tepi KIRI
          im._fly = { dx, order };
        });
      });
      // urutan rilis mengikuti "order" (jarak terjauh dulu agar selesai bareng)
      rowImgs.forEach((ims, ri) => {
        ims.slice(0, 8).forEach((im) => {
          const { dx, order } = im._fly;
          im.style.transition = 'none';
          im.style.transform = `translate(${dx}px, 6px) scale(.98)`;
          im.style.opacity = '0';
          queue(() => {
            im.style.transition = `transform ${FLIGHT}ms cubic-bezier(.22,.85,.25,1), opacity ${FLIGHT - 150}ms ease`;
            im.style.transform = 'translateY(6px) scale(.98)';
            im.style.opacity = '.18';
          }, ENTER_DELAY + order * STAG);
        });
      });
      queue(finishEnter, ENTER_DELAY + 7 * STAG + FLIGHT + 60);
    }

    function finishEnter(){
      // lepas semua gaya inline → foto kembali diatur CSS, lalu sambung ke marquee tanpa lompatan
      imgs.forEach(im => {
        im.style.removeProperty('transition');
        im.style.removeProperty('transform');
        im.style.removeProperty('opacity');
      });
      o[0] = ((-txEnt % W) + W) % W;
      o[1] = ((txEnt + W) % W + W) % W;
      el.classList.add('run');
      phase = 'run';
    }

    /* ---- mesin gerak per frame ---- */
    function frame(now){
      if(token !== runToken) return;
      const dt = Math.min((now - last) / 1000, .05); last = now;

      if(phase === 'run' && !reduced){
        rows.forEach((r, i) => {
          o[i] += speed[i] * dt;
          const tx = (i === 0) ? -(o[0] % W) : ((o[1] % W) - W);
          r.style.transform = `translateX(${tx}px)`;
        });
      }
      else if(phase === 'exit'){
        rows.forEach((r, i) => {
          speed[i] += 2600 * dt;
          o[i] += speed[i] * dt;
          const tx = (i === 0) ? -o[0] : (o[1] - W);
          r.style.transform = `translateX(${tx}px)`;
          if(Math.abs(tx) > W + innerWidth){ exitDone |= (1 << i); r.style.opacity = '0'; }
        });
        if(exitDone === 3 && !gone){ gone = true; onRowsGone(); }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---------- urutan waktu ---------- */
    let step = 0, finished = false;
    const STEP_MS = 440;
    const START   = ENTER_DELAY + 7 * STAG + FLIGHT + 260;  // galeri menyala setelah strip duduk

    function activateNext(){
      if(step >= 8){ finishLoad(); return; }
      const c = step;
      [imgs[c], imgs[c+8], imgs[c+16], imgs[c+24]].forEach(im => im.classList.add('on'));
      step++;
      queue(activateNext, STEP_MS);
    }

    function finishLoad(){
      if(finished) return; finished = true;
      queue(exitRows, 1250);   // tunggu galeri benar-benar lengkap dulu
    }

    function exitRows(){
      if(reduced){
        rows.forEach(r => { r.style.transition = 'opacity .5s,filter .5s'; r.style.opacity = '0'; r.style.filter = 'blur(8px)'; });
        queue(onRowsGone, 550); return;
      }
      o[0] = o[0] % W; o[1] = o[1] % W;
      phase = 'exit';
    }

    function onRowsGone(){
      el.classList.add('titleout');
      queue(() => {
        const v = document.createElement('div');
        v.className = 'veil';
        el.appendChild(v);
        requestAnimationFrame(() => v.classList.add('on'));
      }, 950);
      queue(() => { buildLoading(); }, 1900);
    }

    queue(activateNext, reduced ? 700 : START);

    // klik di mana saja untuk mempercepat pemuatan
    el.addEventListener('click', () => {
      if(finished) return;
      timers.forEach(clearTimeout); timers.clear();
      if(phase === 'enter') finishEnter();   // foto yang belum terbang langsung duduk di slotnya
      imgs.forEach(im => im.classList.add('on'));
      step = 8;
      finishLoad();
    });
  }

  buildLoading();
})();
</script>
</body>
