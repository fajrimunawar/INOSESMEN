 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scroll */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #090A0F;
            color: #FFFFFF;
        }

        /* Latar Belakang Modern & Dynamic Background */
        .page-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 2rem;
            position: relative;
            background: 
                radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                #090A0F;
        }

        /* Aksen Garis Kaca Minimalis (Top Grid Line) */
        .page-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
        }

        /* Area Utama (Judul) */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 900px;
            z-index: 2;
        }

        .title-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 4rem 3rem;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .main-title {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            background: linear-gradient(135deg, #FFFFFF 30%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Footer (Hak Cipta) */
        .footer-content {
            z-index: 2;
            text-align: center;
        }

        .copyright {
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .copyright span {
            color: #D4AF37;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Main Section -->
        <main class="main-content">
            <div class="title-card">
                <h1 class="main-title">EXECUTIVE DIGITAL ENTERPRISE</h1>
            </div>
        </main>

        <!-- Footer Section -->
        <footer class="footer-content">
            <p class="copyright">&copy; <span>2026</span> ALL RIGHTS RESERVED</p>
        </footer>
    </div>

</body>
</html>
