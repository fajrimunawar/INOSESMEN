<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* TIDAK ADA SCROLL */
            background: #020611; /* Latar hitam kebiruan pekat */
            font-family: 'Outfit', sans-serif;
        }

        .main-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membagi judul ke tengah, menu ke bawah */
            align-items: center;
            padding: 50px 20px;
            position: relative;
            z-index: 10;
        }

        /* Cahaya Latar Organik */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vmin; 
            height: 90vmin;
            background: radial-gradient(circle, rgba(0, 86, 210, 0.12) 0%, transparent 60%);
            z-index: 1;
            animation: breathe 10s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* BAGIAN TENGAH (Judul & Hak Cipta) */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* FORMAT KALIMAT JUDUL (SANGAT TEBAL, SOLID, PROFESIONAL) */
        h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800; /* BERAT FONT MAKSIMAL AGAR TIDAK KURUS */
            font-size: clamp(1.4rem, 6.5vw, 5.5rem); /* Otomatis mengecil di HP tanpa berantakan */
            line-height: 1.1;
            letter-spacing: clamp(1px, 0.5vw, 3px); /* Spacing elegan */
            text-transform: uppercase;
            white-space: nowrap; /* PAKSA TETAP 1 BARIS */
            
            /* Gradasi Biru Mulus dan Tajam */
            background: linear-gradient(90deg, #002B5B 0%, #0072E3 40%, #00C2FF 70%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 122, 227, 0.4)); /* Efek cahaya berbobot */
            margin-bottom: 30px;
        }

        /* Garis Pemisah Tipis */
        .divider-line {
            width: clamp(50px, 15vw, 120px);
            height: 2px;
            background: linear-gradient(90deg, transparent, #0072E3, transparent);
            margin-bottom: 20px;
        }

        /* Hak Cipta */
        .copyright {
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            letter-spacing: clamp(3px, 1vw, 6px);
            text-transform: uppercase;
            color: #4A7BA8;
            font-weight: 300;
        }

        /* BAGIAN BAWAH (Menu Horizontal Rapi) */
        .bottom-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(15px, 5vw, 50px); /* Jarak menu otomatis menyesuaikan layar */
            flex-wrap: wrap; /* Aman jika layar sangat sempit */
            width: 100%;
            padding-top: 20px;
        }

        .menu-item {
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.7rem, 2.2vw, 0.9rem);
            letter-spacing: clamp(2px, 0.5vw, 4px);
            text-transform: uppercase;
            font-weight: 500; /* Menu juga sedikit lebih tegas */
            color: #5A9BD4; /* Biru redup */
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        /* Efek Hover Berkelas (Garis Bawah Meluncir) */
        .menu-item::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #00C2FF, #00E5FF);
            transition: width 0.3s ease;
        }

        .menu-item:hover {
            color: #00E5FF; /* Biru terang saat disorot */
        }

        .menu-item:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Latar Cahaya Organik -->
    <div class="ambient-glow"></div>

    <!-- Konten Utama -->
    <div class="main-container">
        
        <!-- Bagian Tengah: Judul & Hak Cipta -->
        <div class="center-content">
            <h1>INTEGRASI DASBOR</h1>
            
            <div class="divider-line"></div>
            <div class="copyright">Hak Cipta &copy; 2024</div>
        </div>

        <!-- Bagian Bawah: Daftar Menu Rapi -->
        <nav class="bottom-menu">
            <a href="#" class="menu-item">Beranda</a>
            <a href="#" class="menu-item">Analitik</a>
            <a href="#" class="menu-item">Sistem</a>
            <a href="#" class="menu-item">Profil</a>
        </nav>

    </div>

</body>
</html>
