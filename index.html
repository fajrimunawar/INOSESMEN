<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* TIDAK ADA SCROLL */
            
            /* GAMBAR DIMASUKKAN */
            background-image: url('https://z-cdn-media.chatglm.cn/files/144bee18-c05e-4f79-a279-d6b536688571.jpeg?auth_key=1887161768-0aed0db43a4e4ee4b0e5f17f82232796-0-3d20dc92ad0c06bbc0a6d9564a2fc28b');
            
            /* DI LEBARIN KE SAMPING 100%, TIDAK DIBESARKAN (ZOOM), TIDAK KEPOTONG */
            background-size: 100% 100%; 
            
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000; /* Hanya fallback sebelum gambar muat */
            
            font-family: 'Outfit', sans-serif;
        }

        .main-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membagi judul ke tengah, menu ke bawah */
            align-items: center;
            padding: 50px 20px;
            position: relative;
            z-index: 10;
        }

        /* BAGIAN TENGAH (Judul & Hak Cipta) */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* FORMAT KALIMAT JUDUL */
        h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800; 
            font-size: clamp(1.4rem, 6.5vw, 5.5rem); 
            line-height: 1.1;
            letter-spacing: clamp(1px, 0.5vw, 3px); 
            text-transform: uppercase;
            white-space: nowrap; 
            
            /* Gradasi Biru Mulus dan Tajam */
            background: linear-gradient(90deg, #002B5B 0%, #0072E3 40%, #00C2FF 70%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Bayangan teks agar terlihat di foto tanpa kotak hitam */
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9));
            margin-bottom: 30px;
        }

        /* Garis Pemisah Tipis */
        .divider-line {
            width: clamp(50px, 15vw, 120px);
            height: 2px;
            background: linear-gradient(90deg, transparent, #00C2FF, transparent);
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 194, 255, 0.5);
        }

        /* Hak Cipta */
        .copyright {
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            letter-spacing: clamp(3px, 1vw, 6px);
            text-transform: uppercase;
            color: #ffffff; 
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* BAGIAN BAWAH (Menu Horizontal Rapi) */
        .bottom-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(15px, 5vw, 50px); 
            flex-wrap: wrap; 
            width: 100%;
            padding-top: 20px;
        }

        .menu-item {
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.7rem, 2.2vw, 0.9rem);
            letter-spacing: clamp(2px, 0.5vw, 4px);
            text-transform: uppercase;
            font-weight: 500; 
            color: #ffffff; 
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* Efek Hover Berkelas */
        .menu-item::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #00C2FF, #00E5FF);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00C2FF;
        }

        .menu-item:hover {
            color: #00E5FF; 
        }

        .menu-item:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Konten Utama (Latar belakang langsung di body) -->
    <div class="main-container">
        
        <!-- Bagian Tengah: Judul & Hak Cipta -->
        <div class="center-content">
            <h1>INTEGRASI DASBOR</h1>
            
            <div class="divider-line"></div>
            <div class="copyright">Hak Cipta &copy; 2024</div>
        </div>

        <!-- Bagian Bawah: Daftar Menu Rapi -->
        <nav class="bottom-menu">
            <a href="#" class="menu-item">Beranda</a>
            <a href="#" class="menu-item">Analitik</a>
            <a href="#" class="menu-item">Sistem</a>
            <a href="#" class="menu-item">Profil</a>
        </nav>

    </div>

</body>
</html>
