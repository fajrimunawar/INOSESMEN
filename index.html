<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Open Sans','Segoe UI',Tahoma,sans-serif;
    background:#0B3B3A;
    color:#0B3B3A;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  #container{
    position:fixed;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    background:linear-gradient(180deg,#81F6EF 0%,#9CF4ED 22%,#B2FBF6 45%,#CFFCF6 68%,#E1FFFD 88%,#E8FEFC 100%);
  }
  #wrapper{
    width:100%;
    position:relative;
    overflow:hidden;
    background:#0B3B3A;
  }
  #content{
    position:absolute;
    top:0;
    left:0;
    width:1280px;
    transform-origin:top left;
  }
  /* Marquee animations */
  @keyframes infotrinkMarqueeHero{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  @keyframes infotrinkMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  @keyframes ifkPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
  @keyframes ifkFlow{to{stroke-dashoffset:-36}}
  /* Stage card hover (alur perjalanan) */
  .ifk-shaft{transition:transform .25s ease,box-shadow .25s ease}
  .ifk-shaft:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(120,100,40,.14)}
  .ifk-check{transition:background .2s ease;border-radius:10px}
  .ifk-check:hover{background:rgba(11,110,106,.05)}
  /* Card hover transitions */
  .hover-card{transition:transform .2s ease,box-shadow .2s ease}
  .hover-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(11,59,58,.12)}
  .hover-card-sm{transition:transform .2s ease}
  .hover-card-sm:hover{transform:translateY(-2px)}
  .btn-telusuri{transition:background .2s ease,transform .2s ease}
  .btn-telusuri:hover{background:#0B3B3A !important;transform:translateX(2px)}
  .btn-x{transition:opacity .3s ease,transform .3s ease,background .2s ease}
  .btn-x:hover{background:#d32f2f !important;transform:scale(1.1) rotate(0deg) !important}
  .nav-link{transition:all .2s ease}
  .nav-link:hover{color:#0B6E6A !important}
  /* Smooth scroll inside container */
  #container{scroll-behavior:auto}
  /* Make sure translated brand name is not translated by Google Translate */
  [translate="no"]{ }
  /* Prevent layout shift while fonts load */
  body{font-display:swap}
  /* SVG arrows for stage labels */
  .stage-arrow{ }
</style>
</head>

/* ===== HELPERS ===== */
// Wrap "INFOTRINK" occurrences with translate="no" so Google Translate keeps the brand name.
function brandText(text){
  if(text == null) return "";
  text = String(text);
  if(text.indexOf("INFOTRINK") === -1) return escapeHtml(text);
  const parts = text.split("INFOTRINK");
  return parts.map((p,i) => escapeHtml(p) + (i < parts.length-1 ? '<span translate="no">INFOTRINK</span>' : '')).join('');
}
function escapeHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
// Convert a style object to a CSS string (camelCase -> kebab-case).
function S(o){
  const out = [];
  for(const k in o){
    if(o[k] == null) continue;
    let v = o[k];
    if(typeof v === 'number' && k !== 'opacity' && k !== 'zIndex' && k !== 'fontWeight' && k !== 'lineHeight' && k !== 'flexGrow' && k !== 'flexShrink' && k !== 'zoom') v = v + 'px';
    const kk = k.replace(/[A-Z]/g, m => '-'+m.toLowerCase());
    out.push(kk+':'+v);
  }
  return out.join(';');
}

/* ===== SHARED HEADER (logo + nav) — used by Beranda hero & SubmenuPage ===== */
function renderHeader(){
  let navLinks = '';
  for(const item of NAV_ITEMS){
    const isActive = state.activeMenu === item;
    const isLastActive = state.lastActiveMenu === item && !state.activeMenu;
    const isDefaultBeranda = item === "Beranda" && !state.activeMenu && !state.lastActiveMenu;
    const highlighted = isActive || isLastActive || isDefaultBeranda;
    navLinks += '<a class="nav-link" href="#" data-nav="'+escapeHtml(item)+'" onclick="return navClick(\''+escapeAttr(item)+'\', event)" style="'+S({
      fontFamily:"'Open Sans', sans-serif", fontSize:"15px",
      fontWeight: highlighted?700:600,
      color: highlighted?"#0B6E6A":"#0B3B3A",
      textDecoration:"none", padding:"4px 0",
      borderBottom: highlighted?"2px solid #0B6E6A":"2px solid transparent",
      letterSpacing:"0.2px", cursor:"pointer", display:"inline-block"
    })+'">'+brandText(item)+'</a>';
  }
  return '<header style="'+S({position:"absolute", top:"32px", left:"70px", right:"70px", display:"flex", alignItems:"center", justifyContent:"space-between", zIndex:10})+'">'
    + '<div style="'+S({display:"flex", alignItems:"center", gap:"12px", padding:"8px 22px 8px 10px", background:"rgba(255,255,255,0.85)", backdropFilter:"blur(10px)", borderRadius:"999px", boxShadow:"0 4px 16px rgba(11,59,58,0.12)", border:"1px solid rgba(255,255,255,0.6)"})+'">'
    + '<img src="slide/logo_icon.png" alt="Infotrink logo" style="'+S({width:"42px", height:"42px", objectFit:"contain", display:"block", filter:"drop-shadow(0 2px 4px rgba(11,59,58,0.15))"})+'">'
    + '<img src="slide/logo_text.png" alt="Infotrink" style="'+S({width:"125px", height:"40px", objectFit:"contain", display:"block"})+'">'
    + '</div>'

    + navLinks + '</nav></header>';
}

/* ===== SHARED: Submenu shell ===== */
function renderSubmenuPage(){
  // Decide which content to render based on menu/submenu
  const menu = state.menu, submenu = state.submenu;
  const isMediaDigital = (menu === "Informasi" && submenu === "Media Digital");
  const isArticleList = (menu === "Publikasi" && submenu === "Media Informasi & Penjelasan");
  const isGaleri = (menu === "Galeri");

  // Article detail view takes priority
  let bodyHtml;
  if(state.article){
    bodyHtml = renderArticleDetail(state.article);
  } else if(isMediaDigital){
    bodyHtml = renderMediaDigital();
  } else if(isArticleList){
    bodyHtml = renderArticleList();
  } else if(menu === "Mengenal INFOTRINK"){
    bodyHtml = renderMengenalInfotrinkPage(submenu);
  } else if(isGaleri || menu === "Informasi" || menu === "Publikasi"){
    bodyHtml = renderMateriUmum(menu, submenu);
  } else {
    bodyHtml = renderMateriUmum(menu, submenu);
  }

  // Overlay menus (always rendered; visibility toggled)
  let overlays = '';
  for(const menuKey of Object.keys(SUB_MENUS)){
    overlays += renderOverlay(menuKey);
  }

  return '<div data-slide-content style="'+S({position:"relative", width:"1280px", minHeight:"720px", background:"linear-gradient(180deg, #81F6EF 0%, #9CF4ED 22%, #B2FBF6 45%, #CFFCF6 68%, #E1FFFD 88%, #E8FEFC 100%)", fontFamily:"'Open Sans', 'Segoe UI', Tahoma, sans-serif"})+'">'
    + renderHeader()
    + overlays
    // Breadcrumb
    + '<div style="'+S({position:"absolute", top:"110px", left:"70px", right:"70px", display:"flex", alignItems:"center", gap:"10px", fontSize:"13px", color:"#5B7A78", fontWeight:600, zIndex:5})+'">'
    + '<button onclick="'+(state.article ? "backToList()" : "backToBeranda()")+'" style="'+S({display:"inline-flex", alignItems:"center", gap:"5px", padding:"6px 14px", background:"white", color:"#0B6E6A", border:"1px solid rgba(11,110,106,0.2)", borderRadius:"999px", fontSize:"12px", fontWeight:700, cursor:"pointer", letterSpacing:"0.3px"})+'">'+(state.article ? "← Media Informasi" : "← Beranda")+'</button>'
    + '<span style="'+S({opacity:0.5})+'">›</span>'
    + '<span>'+brandText(menu)+'</span>'
    + '<span style="'+S({opacity:0.5})+'">›</span>'
    + '<span style="'+S({color:"#0B3B3A", fontWeight:700})+'">'+brandText(submenu)+'</span>'

}

/* ===== MATERI UMUM (Galeri & fallback for other submenus) ===== */
function renderMateriUmum(menu, submenu){
  const isGaleri = (menu === "Galeri");

  if(isGaleri){
    introText = "Arsip visual dan dokumentasi. Bagian ini menyajikan potret kegiatan dan dokumentasi yang mengiringi materi INFOTRINK.";
  } else if(menu === "Publikasi"){
    introText = "Pusat seluruh konten yang diterbitkan. Bagian "+submenu+" menghimpun dokumen dengan jenis materi tersebut; dokumen yang telah terbit saat ini dapat ditelusuri pada Media Informasi & Penjelasan.";
  } else {
    introText = "Pengelompokan informasi berdasarkan bidang. Bagian "+submenu+" menghimpun dokumentasi pada bidang tersebut, dirangkum mulai dari awal mula, perencanaan, sampai perwujudan dan pengembangannya.";
  }
  const items = (SUB_MENUS[menu] && SUB_MENUS[menu].items) ? SUB_MENUS[menu].items : [];
  const tersedia = (menu === "Publikasi" && submenu === "Media Informasi & Penjelasan") || (menu === "Informasi" && submenu === "Media Digital");

  let galeriHtml = '';
  if(isGaleri){
    galeriHtml = '<div style="'+S({display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:"16px", marginBottom:"28px"})+'">'+GALERI_ARSIP.map(g => '<div style="'+S({background:"white", borderRadius:"16px", overflow:"hidden", border:"1px solid rgba(11,110,106,0.06)", boxShadow:"0 4px 12px rgba(11,59,58,0.06)"})+'"><img src="'+escapeAttr(g.src)+'" alt="'+escapeAttr(g.caption)+'" style="'+S({width:"100%", height:"200px", objectFit:"cover", display:"block"})+'"><div style="'+S({padding:"12px 16px", fontSize:"12.5px", fontWeight:700, color:"#0B3B3A"})+'">'+escapeHtml(g.caption)+'</div></div>').join('')+'</div>';
  }
  let pendingHtml = '';
  if(!isGaleri && !tersedia){
    pendingHtml = '<div style="'+S({background:"rgba(11,110,106,0.06)", borderRadius:"16px", padding:"24px 28px", border:"1px dashed rgba(11,110,106,0.25)", display:"flex", alignItems:"center", gap:"18px", marginBottom:"28px"})+'">'
      + '<div style="'+S({width:"44px", height:"44px", borderRadius:"12px", background:"rgba(11,110,106,0.12)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:"20px"})+'">⏳</div>'
      + '<div style="'+S({flex:1})+'"><h3 style="'+S({fontSize:"15.5px", fontWeight:800, color:"#0B3B3A", margin:"0 0 4px 0"})+'">Menanti Publikasi</h3><p style="'+S({fontSize:"13px", color:"#5B7A78", margin:0, lineHeight:1.65, textAlign:"justify", textJustify:"inter-word"})+'">Dokumen untuk bagian ini menanti publikasi. Materi yang telah terbit dapat ditelusuri terlebih dahulu di bawah ini.</p></div>'
      + '<button onclick="openSubmenu(\'Publikasi\', \''+escapeAttr(SUB_MENUS["Publikasi"].items[0])+'\')" style="'+S({padding:"11px 20px", background:"#0B6E6A", color:"white", border:"none", borderRadius:"999px", fontSize:"13px", fontWeight:700, cursor:"pointer", flexShrink:0, whiteSpace:"nowrap"})+'">Lihat Media Informasi →</button>'
      + '</div>';
  }
  let otherItemsHtml = '';
  if(items.length > 0){
    const filtered = items.filter(it => it !== submenu);
    if(filtered.length > 0){
      const heading = menu === "Publikasi" ? "Jenis Materi Lainnya" : (menu === "Informasi" ? "Bidang Lainnya" : "Bagian Galeri Lainnya");
      const cards = filtered.map(item => {
        const itemTersedia = (menu === "Publikasi" && item === "Media Informasi & Penjelasan") || (menu === "Informasi" && item === "Media Digital");
        return '<div class="hover-card-sm" onclick="openSubmenu(\''+escapeAttr(menu)+'\', \''+escapeAttr(item)+'\')" style="'+S({display:"flex", alignItems:"center", justifyContent:"space-between", gap:"12px", padding:"16px 18px", background:"white", borderRadius:"12px", border:"1px solid rgba(11,110,106,0.06)", boxShadow:"0 2px 8px rgba(11,59,58,0.04)", cursor:"pointer"})+'"><div><div style="'+S({fontSize:"14px", fontWeight:700, color:"#0B3B3A"})+'">'+brandText(item)+'</div><div style="'+S({fontSize:"11px", color: itemTersedia?"#0B6E6A":"#9CB3B0", fontWeight:700, marginTop:"2px"})+'">'+(itemTersedia?"Tersedia — lihat materi →":"Menanti publikasi →")+'</div></div></div>';
      }).join('');

/* ===== EVENT HANDLERS ===== */
function navClick(item, ev){
  if(ev){ ev.preventDefault(); }
  if(item === "Beranda"){
    if(state.activeMenu){
      const cm = state.activeMenu;
      state.closingMenu = cm;
      setTimeout(function(){ if(state.closingMenu === cm) state.closingMenu = null; renderOverlaysOnly(); }, 1500);
    }
    state.activeMenu = null;
    state.lastActiveMenu = "Beranda";
    state.view = 'beranda';
    state.menu = null; state.submenu = null; state.article = null;
    scrollTop();
    fullRender();
    return false;
  }
  if(state.activeMenu === item){
    // close this menu
    state.closingMenu = item;
    setTimeout(function(){ if(state.closingMenu === item) state.closingMenu = null; renderOverlaysOnly(); }, 1500);
    state.activeMenu = null;
    state.lastActiveMenu = item;
  } else if(state.activeMenu === null){
    // open
    measureNavPositions();
    state.activeMenu = item;
    state.lastActiveMenu = item;
    requestAnimationFrame(function(){ measureNavPositions(); renderOverlaysOnly(); });
  } else {
    // Different menu is open — close current, then open new one
    const cm = state.activeMenu;
    state.closingMenu = cm;
    setTimeout(function(){ if(state.closingMenu === cm) state.closingMenu = null; renderOverlaysOnly(); }, 1500);
    state.activeMenu = null;
    measureNavPositions();
    state.activeMenu = item;
    state.lastActiveMenu = item;
    requestAnimationFrame(function(){ measureNavPositions(); renderOverlaysOnly(); });
  }
  renderOverlaysOnly();
  return false;
}

function closeOverlay(){
  if(state.activeMenu){
    state.closingMenu = state.activeMenu;
    const cm = state.activeMenu;
    setTimeout(function(){ if(state.closingMenu === cm) state.closingMenu = null; renderOverlaysOnly(); }, 1500);
  }
  state.activeMenu = null;
  renderOverlaysOnly();
}

function openSubmenu(menu, submenu){
  // close overlay first (with closing animation)
  if(state.activeMenu){
    state.closingMenu = state.activeMenu;
    const cm = state.activeMenu;
    setTimeout(function(){ if(state.closingMenu === cm) state.closingMenu = null; renderOverlaysOnly(); }, 1500);
  }
  state.activeMenu = null;
  state.view = 'submenu';
  state.menu = menu;
  state.submenu = submenu;
  state.article = null;
  scrollTop();
  fullRender();
}

function openSubmenuFromFooter(menu, submenu){
  // Reset closing state when coming from footer (no overlay was open)
  state.closingMenu = null;
  state.activeMenu = null;
  state.view = 'submenu';
  state.menu = menu;
  state.submenu = submenu;
  state.article = null;
  scrollTop();
  fullRender();
  return false;
}

function selectArticle(slug){
  state.article = slug;
  scrollTop();
  fullRender();
}

function backToList(){
  state.article = null;
  scrollTop();
  fullRender();
}

function backToBeranda(){
  state.view = 'beranda';
  state.menu = null; state.submenu = null; state.article = null;
  state.activeMenu = null; state.closingMenu = null;
  scrollTop();
  fullRender();
}

function scrollTop(){
  const c = document.getElementById('container');
  if(c) c.scrollTop = 0;
}

/* ===== RENDER ENTRYPOINTS ===== */
function fullRender(){
  const content = document.getElementById('content');
  if(state.view === 'beranda'){
    content.innerHTML = renderHero() + renderBerandaSections();
  } else {
    content.innerHTML = renderSubmenuPage();
  }
  applyZoom();
  // Defer height/position measurements until after paint.
  requestAnimationFrame(function(){
    measureContentHeight();
    measureNavPositions();
  });
}

// Re-render only the overlays (so nav clicks don't disturb Beranda sections scroll)
function renderOverlaysOnly(){
  const slide = document.querySelector('[data-slide-content]');
  if(!slide) return;
  // Remove existing overlay-menu nodes
  const existing = slide.querySelectorAll('.overlay-menu');
  for(let i=0; i<existing.length; i++) existing[i].remove();
  // Build new overlays HTML and append at end of slide content.
  // (Stacking is governed by zIndex on inner SVG/box/X — DOM order is fine.)
  let html = '';
  for(const menuKey of Object.keys(SUB_MENUS)){
    html += renderOverlay(menuKey);
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  while(tmp.firstChild){
    slide.appendChild(tmp.firstChild);
  }
}

/* ===== SCALE / ZOOM (mimics CSS zoom from the React source) ===== */
function updateScale(){
  const el = document.getElementById('container');
  if(!el) return;
  const w = el.clientWidth;
  state.scale = Math.max(w/1280, 0.5);
}
function applyZoom(){
  const content = document.getElementById('content');
  if(content && state.scale > 0){
    content.style.zoom = state.scale;
  }
}
function measureContentHeight(){
  const content = document.getElementById('content');
  if(!content) return;
  // With CSS zoom, scrollHeight returns the UNSCALED value; visual height = scrollHeight × scale.
  const actualHeight = content.scrollHeight * state.scale;
  if(actualHeight > 0){
    state.contentHeight = actualHeight;
    const wrapper = document.getElementById('wrapper');
    if(wrapper) wrapper.style.height = actualHeight + 'px';
  }
}
function measureNavPositions(){
  const el = document.getElementById('container');
  if(!el) return;
  const slideEl = document.querySelector('[data-slide-content]');
  if(!slideEl) return;
  const slideRect = slideEl.getBoundingClientRect();
  const currentScale = slideRect.width / 1280;
  if(currentScale === 0) return;
  const positions = {};
  const navEls = slideEl.querySelectorAll('[data-nav]');
  for(let i=0; i<navEls.length; i++){
    const navEl = navEls[i];
    const item = navEl.getAttribute('data-nav');
    const navRect = navEl.getBoundingClientRect();
    const centerX = (navRect.left + navRect.width/2 - slideRect.left) / currentScale;
    positions[item] = centerX;
  }
  state.navPositions = positions;
  // Update overlay SVG path & dots with the freshly measured X
  updateOverlayPositions();
}
function updateOverlayPositions(){
  const slideEl = document.querySelector('[data-slide-content]');
  if(!slideEl) return;
  const overlays = slideEl.querySelectorAll('.overlay-menu');
  for(let i=0; i<overlays.length; i++){
    const menuKey = overlays[i].getAttribute('data-menu');
    const navX = state.navPositions[menuKey] != null ? state.navPositions[menuKey] : NAV_X[menuKey];
    const linePath = "M "+navX+" "+LINE_START_Y+" L "+navX+" "+LINE_TURN_Y+" L "+BOX_LEFT+" "+LINE_TURN_Y;
    const path = overlays[i].querySelector('path');
    if(path) path.setAttribute('d', linePath);
    const circles = overlays[i].querySelectorAll('circle');
    if(circles.length >= 1) circles[0].setAttribute('cx', navX);
    // second circle (BOX_LEFT, LINE_TURN_Y) stays fixed
  }
}

/* ===== INIT ===== */
function init(){
  updateScale();
  fullRender();
  // Resize handling
  window.addEventListener('resize', function(){
    updateScale();
    applyZoom();
    measureContentHeight();
    measureNavPositions();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(function(){
      updateScale();
      applyZoom();
      measureContentHeight();
      measureNavPositions();
    }, 100);
  });
  // Re-measure after fonts/layout settle
  setTimeout(function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); }, 100);
  setTimeout(function(){ updateScale(); applyZoom(); measureContentHeight(); measureNavPositions(); }, 500);
  // Observe content changes so wrapper height stays in sync
  const content = document.getElementById('content');
  if(content && typeof MutationObserver !== 'undefined'){
    const mo = new MutationObserver(function(){
      requestAnimationFrame(measureContentHeight);
    });
    mo.observe(content, { childList:true, subtree:true, characterData:true });
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
