<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* TIDAK ADA SCROLL */
            background: #01030A; /* Latar hitam kebiruan pekat */
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Cahaya Latar Belakang Biru Halus */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(0, 98, 210, 0.12) 0%, transparent 65%);
            z-index: 1;
            animation: breathe 10s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Tata Letak Judul di Tengah */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 120px 0 40px; /* Memberi ruang untuk menu kanan */
        }

        /* JUDUL: 1 GARIS DENGAN GRADASI BIRU KELAS ATAS */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 5.5vw, 4.5rem); /* Otomatis mengecil agar PASTI 1 baris */
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap; /* PAKSA TETAP 1 BARIS */
            
            /* Gradasi Biru Tajam */
            background: linear-gradient(90deg, #002B5B 0%, #0072E3 40%, #00C2FF 80%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(0, 122, 227, 0.3));
            margin-bottom: 40px;
        }

        /* Garis Pemisah Minimalis */
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0072E3, transparent);
            margin: 0 auto 30px auto;
        }

        /* Hak Cipta di Bawah Judul */
        .copyright {
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #4A7BA8;
            font-weight: 300;
        }

        /* DESAIN DAFTAR MENU VERTIKAL (BEDA & BERKELAS) */
        .vertical-menu {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 35px;
            border-left: 1px solid rgba(0, 114, 227, 0.2); /* Garis tipis penghubung */
            padding-left: 25px;
        }

        .menu-item {
            writing-mode: vertical-rl; /* Teks berjalan dari atas ke bawah */
            text-orientation: mixed;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 400;
            color: #5A9BD4; /* Warna biru redup */
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        /* Efek Hover Sangat Berkelas */
        .menu-item:hover {
            color: transparent;
            background: linear-gradient(180deg, #00C2FF 0%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            transform: translateX(-5px); /* Sedikit bergeser ke kiri */
            text-shadow: 0 0 10px rgba(0, 194, 255, 0.4);
        }

        /* Responsif untuk Layar Kecil (HP) */
        @media (max-width: 768px) {
            .content-wrapper {
                padding: 0 80px 0 20px; /* Menyesuaikan ruang menu */
            }
            h1 {
                letter-spacing: 1px;
                margin-bottom: 30px;
            }
            .vertical-menu {
                right: 20px;
                gap: 25px;
                padding-left: 15px;
            }
            .menu-item {
                font-size: 0.7rem;
                letter-spacing: 3px;
            }
            .copyright {
                font-size: 0.65rem;
                letter-spacing: 4px;
            }
        }

    </style>
</head>
<body>

    <!-- Latar Organik -->
    <div class="ambient-glow"></div>

    <!-- Daftar Menu Vertikal di Tepi Kanan -->
    <nav class="vertical-menu">
        <a href="#" class="menu-item">Beranda</a>
        <a href="#" class="menu-item">Analitik</a>
        <a href="#" class="menu-item">Sistem</a>
        <a href="#" class="menu-item">Profil</a>
    </nav>

    <!-- Konten Utama Murni -->
    <div class="content-wrapper">
        <h1>INTEGRASI DASBOR</h1>
        
        <div class="divider"></div>
        <div class="copyright">Hak Cipta &copy; 2024</div>
    </div>

</body>
</html>
