<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Outfit:wght@300;400;500;700&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            width: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            background-color: #000;
            font-family: 'Outfit', sans-serif;
        }
        body.loaded { overflow-y: auto; }

        /* ===================== PRELOADER ===================== */
        #preloader {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #000a1a 0%, #001a3a 25%, #002b5b 50%, #001a3a 75%, #000a1a 100%);
            overflow: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        body.loaded #preloader { opacity: 0; visibility: hidden; pointer-events: none; }

        #preloader::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0,160,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,160,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none;
        }

        .preloader-glow {
            position: absolute; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,120,220,0.12) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; animation: glowBreathe 5s ease-in-out infinite;
        }
        @keyframes glowBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .particle { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; animation: particleFloat linear infinite; }
        @keyframes particleFloat {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            10% { opacity: 1; transform: translateY(-10vh) scale(1); }
            90% { opacity: 0.5; }
            100% { transform: translateY(-105vh) scale(0.3); opacity: 0; }
        }

        .h-line { position: absolute; height: 1px; pointer-events: none; opacity: 0; animation: lineMove linear infinite; }
        @keyframes lineMove {
            0% { transform: translateX(-100%); opacity: 0; }
            15% { opacity: 1; } 85% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        .bg-orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(40px); animation: orbDrift ease-in-out infinite alternate; }
        @keyframes orbDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(var(--dx), var(--dy)); } }

        .loader-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 90vw; position: relative; z-index: 2; }
        .loader-box {
            width: clamp(52px, 9vw, 72px); height: clamp(52px, 9vw, 72px);
            background: rgba(0, 15, 40, 0.6); border: 1px solid rgba(0, 140, 255, 0.1);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            font-size: clamp(1.4rem, 3.8vw, 2.2rem); color: rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; line-height: 1; backdrop-filter: blur(10px);
        }
        .loader-box .shine {
            position: absolute; top: -50%; left: -100%; width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg); transition: left 0.8s ease;
        }
        .loader-box.locked .shine { left: 160%; }
        .loader-box.locked { transform: translateY(-4px); background: rgba(0, 15, 40, 0.8); }
        .loader-box.box-1.locked { color: #00E5FF; border-color: rgba(0,229,255,0.4); text-shadow: 0 0 10px rgba(0,229,255,0.9), 0 0 30px rgba(0,229,255,0.5), 0 0 60px rgba(0,229,255,0.25); box-shadow: 0 6px 25px rgba(0,229,255,0.12), inset 0 1px 0 rgba(0,229,255,0.1); }
        .loader-box.box-2.locked { color: #00DDFF; border-color: rgba(0,221,255,0.4); text-shadow: 0 0 10px rgba(0,221,255,0.9), 0 0 30px rgba(0,221,255,0.5), 0 0 60px rgba(0,221,255,0.25); box-shadow: 0 6px 25px rgba(0,221,255,0.12), inset 0 1px 0 rgba(0,221,255,0.1); }
        .loader-box.box-3.locked { color: #00D4FF; border-color: rgba(0,212,255,0.4); text-shadow: 0 0 10px rgba(0,212,255,0.9), 0 0 30px rgba(0,212,255,0.5), 0 0 60px rgba(0,212,255,0.25); box-shadow: 0 6px 25px rgba(0,212,255,0.12), inset 0 1px 0 rgba(0,212,255,0.1); }
        .loader-box.box-4.locked { color: #00C8FF; border-color: rgba(0,200,255,0.4); text-shadow: 0 0 10px rgba(0,200,255,0.9), 0 0 30px rgba(0,200,255,0.5), 0 0 60px rgba(0,200,255,0.25); box-shadow: 0 6px 25px rgba(0,200,255,0.12), inset 0 1px 0 rgba(0,200,255,0.1); }
        .loader-box.box-5.locked { color: #00B8FF; border-color: rgba(0,184,255,0.4); text-shadow: 0 0 10px rgba(0,184,255,0.9), 0 0 30px rgba(0,184,255,0.5), 0 0 60px rgba(0,184,255,0.25); box-shadow: 0 6px 25px rgba(0,184,255,0.12), inset 0 1px 0 rgba(0,184,255,0.1); }
        .loader-box.box-6.locked { color: #00A5FF; border-color: rgba(0,165,255,0.4); text-shadow: 0 0 10px rgba(0,165,255,0.9), 0 0 30px rgba(0,165,255,0.5), 0 0 60px rgba(0,165,255,0.25); box-shadow: 0 6px 25px rgba(0,165,255,0.12), inset 0 1px 0 rgba(0,165,255,0.1); }
        .loader-box.box-7.locked { color: #0090FF; border-color: rgba(0,144,255,0.4); text-shadow: 0 0 10px rgba(0,144,255,0.9), 0 0 30px rgba(0,144,255,0.5), 0 0 60px rgba(0,144,255,0.25); box-shadow: 0 6px 25px rgba(0,144,255,0.12), inset 0 1px 0 rgba(0,144,255,0.1); }
        .loader-box.box-8.locked { color: #0080FF; border-color: rgba(0,128,255,0.4); text-shadow: 0 0 10px rgba(0,128,255,0.9), 0 0 30px rgba(0,128,255,0.5), 0 0 60px rgba(0,128,255,0.25); box-shadow: 0 6px 25px rgba(0,128,255,0.12), inset 0 1px 0 rgba(0,128,255,0.1); }
        .loader-box.box-9.locked { color: #0070FF; border-color: rgba(0,112,255,0.4); text-shadow: 0 0 10px rgba(0,112,255,0.9), 0 0 30px rgba(0,112,255,0.5), 0 0 60px rgba(0,112,255,0.25); box-shadow: 0 6px 25px rgba(0,112,255,0.12), inset 0 1px 0 rgba(0,112,255,0.1); }

        /* ===================== HERO ===================== */
        .hero {
            height: 100vh; width: 100%;
            background-image: url('https://z-cdn-media.chatglm.cn/files/a0fe9c01-2ac1-4d6a-8b9d-12fbf218e7af.jpeg?auth_key=1887163107-13e9e42b53fb45e0b542c8231d2f412b-0-62a5c68ca73daf96291eed30d02b3328');
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 50px 20px; position: relative; z-index: 10;
        }
        .hero-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; width: 100%; }
        .hero h1 {
            font-family: 'Sora', sans-serif; font-weight: 800;
            font-size: clamp(1.4rem, 6.5vw, 5.5rem); line-height: 1.1;
            letter-spacing: clamp(1px, 0.5vw, 3px); text-transform: uppercase; white-space: nowrap;
            background: linear-gradient(90deg, #002B5B 0%, #0072E3 40%, #00C2FF 70%, #00E5FF 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.9)); margin-bottom: 30px;
        }
        .divider-line { width: clamp(50px, 15vw, 120px); height: 2px; background: linear-gradient(90deg, transparent, #00C2FF, transparent); margin-bottom: 20px; box-shadow: 0 2px 10px rgba(0,194,255,0.5); }
        .copyright { font-size: clamp(0.65rem, 1.4vw, 0.78rem); letter-spacing: 1.2px; text-transform: none; color: rgba(255,255,255,0.45); font-weight: 300; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
        .hero-menu { display: flex; align-items: center; justify-content: center; width: 100%; padding-top: 20px; }
        .menu-item { text-decoration: none; font-family: 'Outfit', sans-serif; font-size: clamp(0.72rem, 1.5vw, 0.85rem); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 400; color: rgba(255,255,255,0.55); padding: 10px 0; cursor: pointer; transition: color 0.4s ease; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }
        .menu-item:hover { color: #00C2FF; }
        .menu-sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); margin: 0 clamp(20px, 4vw, 40px); flex-shrink: 0; }

        /* ===================== PUSAT UTAMA — TOTAL ROMBAK ===================== */
        .pusat-section {
            height: 100vh;
            width: 100%;
            background: #020408;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        /* Subtle ambient light */
        .pusat-ambient {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(0,100,220,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        /* --- JUDUL PUSAT UTAMA --- */
        .pusat-header {
            flex: 0 0 auto;
            text-align: center;
            padding-top: clamp(28px, 5vh, 60px);
            padding-bottom: clamp(16px, 2.5vh, 30px);
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .pusat-header-line {
            width: clamp(30px, 8vw, 60px);
            height: 1px;
            margin: 0 auto clamp(10px, 1.5vh, 16px);
            background: linear-gradient(90deg, transparent, rgba(0,194,255,0.3), transparent);
        }

        .pusat-header h2 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: clamp(1.5rem, 5vw, 3.8rem);
            letter-spacing: clamp(5px, 1.8vw, 18px);
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(135deg, #00E5FF 0%, #0080FF 50%, #003D99 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0,140,255,0.15));
        }

        .pusat-header-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: clamp(8px, 1.2vh, 14px);
        }
        .pusat-header-dots i {
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(0,194,255,0.25);
        }
        .pusat-header-dots i:nth-child(2) {
            width: 16px; height: 1px; border-radius: 0;
            background: linear-gradient(90deg, transparent, rgba(0,194,255,0.2), transparent);
        }

        /* --- PEMISAH HORIZONTAL --- */
        .pusat-divider {
            flex: 0 0 auto;
            width: 80%;
            max-width: 700px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,140,255,0.08) 30%, rgba(0,140,255,0.08) 70%, transparent);
            position: relative;
            z-index: 2;
        }

        /* --- 3 ITEM — MERATA ISI SISA RUANG --- */
        .pusat-list {
            flex: 1 1 auto;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            position: relative;
            z-index: 2;
            padding: 0 clamp(16px, 5vw, 60px);
            min-height: 0;
        }

        .pusat-item {
            cursor: pointer;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Nomor transparan di belakang */
        .pusat-item .num {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: clamp(3.5rem, 9vw, 7rem);
            line-height: 1;
            position: absolute;
            opacity: 0.025;
            color: #fff;
            pointer-events: none;
            transition: opacity 0.5s ease;
            user-select: none;
        }

        /* Posisi nomor berbeda tiap item */
        .pusat-item:nth-child(1) .num { left: 2%; top: 50%; transform: translateY(-50%); }
        .pusat-item:nth-child(2) .num { left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .pusat-item:nth-child(3) .num { right: 2%; top: 50%; transform: translateY(-50%); }
        .pusat-item:hover .num { opacity: 0.06; }

        /* Inner wrapper */
        .pusat-inner {
            display: flex;
            align-items: center;
            gap: clamp(14px, 2.5vw, 28px);
            position: relative;
            z-index: 2;
        }

        /* Variasi arah per item */
        .pusat-item:nth-child(1) .pusat-inner { flex-direction: row; }
        .pusat-item:nth-child(2) .pusat-inner { flex-direction: row; justify-content: center; }
        .pusat-item:nth-child(3) .pusat-inner { flex-direction: row-reverse; }

        /* Indeks nomor kecil di samping judul */
        .pusat-idx {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            letter-spacing: 2px;
            color: rgba(0, 180, 255, 0.35);
            flex-shrink: 0;
            width: clamp(28px, 4vw, 40px);
            text-align: center;
            transition: color 0.4s ease;
        }
        .pusat-item:hover .pusat-idx { color: rgba(0, 200, 255, 0.7); }

        /* Garis vertikal tipis di samping */
        .pusat-bar {
            width: 1px;
            height: clamp(28px, 4vh, 44px);
            background: linear-gradient(180deg, transparent, rgba(0,160,255,0.15), transparent);
            flex-shrink: 0;
            transition: height 0.5s ease, background 0.4s ease;
        }
        .pusat-item:hover .pusat-bar {
            height: clamp(36px, 5vh, 52px);
            background: linear-gradient(180deg, transparent, rgba(0,180,255,0.35), transparent);
        }

        /* Judul item */
        .pusat-name {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: clamp(1.2rem, 3.5vw, 2.6rem);
            letter-spacing: clamp(2px, 0.8vw, 5px);
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.2;
            transition: color 0.4s ease, letter-spacing 0.5s ease, transform 0.4s ease;
            white-space: nowrap;
        }
        .pusat-item:hover .pusat-name {
            color: #ffffff;
            letter-spacing: clamp(4px, 1.2vw, 8px);
            transform: translateX(4px);
        }
        .pusat-item:nth-child(3):hover .pusat-name {
            transform: translateX(-4px);
        }

        /* Garis aksen bawah — variasi arah */
        .pusat-accent {
            height: 2px;
            margin-top: 10px;
            width: 0;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 2px;
        }
        .pusat-item:nth-child(1) .pusat-accent {
            background: linear-gradient(90deg, #00E5FF, rgba(0,140,255,0.2), transparent);
        }
        .pusat-item:nth-child(2) .pusat-accent {
            background: linear-gradient(90deg, transparent, rgba(0,130,255,0.2), #0090FF, rgba(0,130,255,0.2), transparent);
            align-self: center;
        }
        .pusat-item:nth-child(3) .pusat-accent {
            background: linear-gradient(270deg, #0050CC, rgba(0,100,220,0.2), transparent);
            align-self: flex-end;
        }
        .pusat-item:hover .pusat-accent { width: clamp(50px, 14vw, 130px); }

        /* Titik di garis tengah antar item */
        .pusat-item-dot {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -3px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(0, 140, 255, 0.12);
            pointer-events: none;
            z-index: 3;
            transition: all 0.4s ease;
        }
        .pusat-item:hover .pusat-item-dot {
            background: rgba(0,194,255,0.5);
            box-shadow: 0 0 8px rgba(0,194,255,0.3);
            transform: translateX(-50%) scale(1.5);
        }

        /* Footer kecil di bawah */
        .pusat-footer {
            flex: 0 0 auto;
            text-align: center;
            padding-bottom: clamp(16px, 3vh, 30px);
            position: relative;
            z-index: 2;
        }
        .pusat-footer-line {
            width: 24px; height: 1px;
            margin: 0 auto 8px;
            background: rgba(0,194,255,0.15);
        }
        .pusat-footer span {
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.12);
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="preloader-glow"></div>
        <div class="loader-grid">
            <div class="loader-box box-1"><div class="shine"></div></div>
            <div class="loader-box box-2"><div class="shine"></div></div>
            <div class="loader-box box-3"><div class="shine"></div></div>
            <div class="loader-box box-4"><div class="shine"></div></div>
            <div class="loader-box box-5"><div class="shine"></div></div>
            <div class="loader-box box-6"><div class="shine"></div></div>
            <div class="loader-box box-7"><div class="shine"></div></div>
            <div class="loader-box box-8"><div class="shine"></div></div>
            <div class="loader-box box-9"><div class="shine"></div></div>
        </div>
    </div>

    <section class="hero">
        <div class="hero-center">
            <h1>INTEGRASI DASBOR</h1>
            <div class="divider-line"></div>
            <div class="copyright">© 2026 Integrasi Dasbor. Hak Cipta Dilindungi Undang-Undang.</div>
        </div>
        <nav class="hero-menu">
            <a href="#" class="menu-item">Beranda</a>
            <div class="menu-sep"></div>
            <a href="#pusat" class="menu-item">Galeri</a>
            <div class="menu-sep"></div>
            <a href="#" class="menu-item">Arsip</a>
        </nav>
    </section>

    <section class="pusat-section" id="pusat">
        <div class="pusat-ambient"></div>

        <!-- JUDUL BESAR -->
        <div class="pusat-header">
            <div class="pusat-header-line"></div>
            <h2>Pusat Utama</h2>
            <div class="pusat-header-dots">
                <i></i><i></i><i></i>
            </div>
        </div>

        <!-- PEMISAH -->
        <div class="pusat-divider"></div>

        <!-- 3 ITEM — OTOMATIS MERATA -->
        <div class="pusat-list">
            <div class="pusat-item">
                <span class="num">01</span>
                <div class="pusat-item-dot"></div>
                <div class="pusat-inner">
                    <div class="pusat-idx">01</div>
                    <div class="pusat-bar"></div>
                    <div>
                        <div class="pusat-name">Media Digital</div>
                        <div class="pusat-accent"></div>
                    </div>
                </div>
            </div>

            <div class="pusat-item">
                <span class="num">02</span>
                <div class="pusat-item-dot"></div>
                <div class="pusat-inner">
                    <div class="pusat-idx">02</div>
                    <div class="pusat-bar"></div>
                    <div>
                        <div class="pusat-name">Pembangunan</div>
                        <div class="pusat-accent"></div>
                    </div>
                </div>
            </div>

            <div class="pusat-item">
                <span class="num">03</span>
                <div class="pusat-inner">
                    <div class="pusat-idx">03</div>
                    <div class="pusat-bar"></div>
                    <div>
                        <div class="pusat-name">Karya Ilmiah</div>
                        <div class="pusat-accent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER KECIL -->
        <div class="pusat-footer">
            <div class="pusat-footer-line"></div>
            <span>Navigasi</span>
        </div>
    </section>

    <script>
        (function() {
            function preventScroll(e) {
                if (!document.body.classList.contains('loaded')) {
                    e.preventDefault(); e.stopPropagation(); return false;
                }
            }
            document.addEventListener('wheel', preventScroll, { passive: false });
            document.addEventListener('touchmove', preventScroll, { passive: false });
            document.addEventListener('keydown', function(e) {
                if (!document.body.classList.contains('loaded')) {
                    if (['ArrowUp','ArrowDown','Space','PageUp','PageDown','Home','End'].indexOf(e.code) > -1) e.preventDefault();
                }
            }, { passive: false });
        })();

        (function() {
            var pre = document.getElementById('preloader');
            for (var i = 0; i < 18; i++) {
                var el = document.createElement('div'); el.className = 'particle';
                var s = Math.random() * 3 + 1;
                el.style.width = s+'px'; el.style.height = s+'px';
                el.style.left = (Math.random()*100)+'%'; el.style.bottom = '-10px';
                el.style.background = 'rgba(0,180,255,'+(Math.random()*0.35+0.1)+')';
                el.style.animationDuration = (Math.random()*8+6)+'s';
                el.style.animationDelay = (Math.random()*8)+'s';
                pre.appendChild(el);
            }
            for (var j = 0; j < 4; j++) {
                var ln = document.createElement('div'); ln.className = 'h-line';
                ln.style.top = (Math.random()*100)+'%';
                ln.style.width = (Math.random()*200+100)+'px';
                ln.style.background = 'linear-gradient(90deg, transparent, rgba(0,160,255,'+(Math.random()*0.1+0.03)+'), transparent)';
                ln.style.animationDuration = (Math.random()*6+5)+'s';
                ln.style.animationDelay = (Math.random()*6)+'s';
                pre.appendChild(ln);
            }
            var orbs = [
                {w:200,x:'10%',y:'20%',c:'rgba(0,80,180,0.08)',dx:'80px',dy:'60px',d:'8s'},
                {w:150,x:'75%',y:'70%',c:'rgba(0,120,220,0.06)',dx:'-60px',dy:'-40px',d:'10s'},
                {w:250,x:'50%',y:'50%',c:'rgba(0,100,200,0.05)',dx:'40px',dy:'-70px',d:'12s'}
            ];
            for (var k = 0; k < orbs.length; k++) {
                var o = orbs[k]; var ob = document.createElement('div'); ob.className = 'bg-orb';
                ob.style.width = o.w+'px'; ob.style.height = o.w+'px';
                ob.style.left = o.x; ob.style.top = o.y; ob.style.background = o.c;
                ob.style.setProperty('--dx',o.dx); ob.style.setProperty('--dy',o.dy);
                ob.style.animationDuration = o.d; pre.appendChild(ob);
            }
        })();

        window.addEventListener('load', function() {
            var target = 'INFOTRINK';
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            var boxes = document.querySelectorAll('.loader-box');
            var idx = 0; var ivs = [];
            for (var i = 0; i < boxes.length; i++) {
                (function(box) {
                    ivs.push(setInterval(function() {
                        box.textContent = chars[Math.floor(Math.random() * chars.length)];
                    }, 80));
                })(boxes[i]);
            }
            function lock() {
                if (idx < target.length) {
                    clearInterval(ivs[idx]);
                    boxes[idx].textContent = target[idx];
                    boxes[idx].classList.add('locked');
                    idx++;
                    setTimeout(lock, 350);
                } else {
                    setTimeout(function() { document.body.classList.add('loaded'); }, 1200);
                }
            }
            setTimeout(lock, 600);
        });
    </script>

</body>
</html>
