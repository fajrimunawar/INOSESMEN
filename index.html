<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* TIDAK ADA SCROLL */
            
            /* MEMASUKKAN GAMBAR BARU ANDA */
            background-image: url('https://z-cdn-media.chatglm.cn/files/a0fe9c01-2ac1-4d6a-8b9d-12fbf218e7af.jpeg?auth_key=1887163107-13e9e42b53fb45e0b542c8231d2f412b-0-62a5c68ca73daf96291eed30d02b3328');
            background-size: 100% 100%; /* DILEBARIN KE SAMPING, MEMNUHI LAYAR, TANPA SISA HITAM */
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000; /* Hanya fallback */
            
            font-family: 'Outfit', sans-serif;
        }

        .main-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Judul tengah, menu bawah */
            align-items: center;
            padding: 50px 20px;
            position: relative;
            z-index: 10;
        }

        /* BAGIAN TENGAH (Judul & Hak Cipta) */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* JUDUL: TEBAL, 1 BARIS, GRADASI BIRU */
        h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800; 
            font-size: clamp(1.4rem, 6.5vw, 5.5rem); 
            line-height: 1.1;
            letter-spacing: clamp(1px, 0.5vw, 3px); 
            text-transform: uppercase;
            white-space: nowrap; 
            
            background: linear-gradient(90deg, #002B5B 0%, #0072E3 40%, #00C2FF 70%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.9)); /* Bayangan agar kontras di foto */
            margin-bottom: 30px;
        }

        /* Garis Pemisah */
        .divider-line {
            width: clamp(50px, 15vw, 120px);
            height: 2px;
            background: linear-gradient(90deg, transparent, #00C2FF, transparent);
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 194, 255, 0.5);
        }

        /* KALIMAT HAK CIPTA PENDEK & PROFESIONAL */
        .copyright {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            letter-spacing: clamp(1px, 0.5vw, 3px);
            text-transform: uppercase;
            color: #ffffff; 
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9); /* Bayangan gelap di belakang teks */
        }

        /* BAGIAN BAWAH (4 Daftar Menu) */
        .bottom-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 6vw, 50px);
            flex-wrap: wrap;
            width: 100%;
            padding-top: 20px;
        }

        .menu-item {
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.75rem, 2.2vw, 0.95rem);
            letter-spacing: clamp(2px, 0.5vw, 4px);
            text-transform: uppercase;
            font-weight: 500;
            color: #ffffff; 
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            padding: 10px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* Efek Hover Garis Bawah */
        .menu-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #00C2FF, #00E5FF);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00C2FF;
        }

        .menu-item:hover {
            color: #00E5FF; 
        }

        .menu-item:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Konten Utama -->
    <div class="main-container">
        
        <!-- Bagian Tengah: Judul & Hak Cipta -->
        <div class="center-content">
            <h1>INTEGRASI DASBOR</h1>
            
            <div class="divider-line"></div>
            <div class="copyright">© 2026 Integrasi Dasbor. Hak Cipta Dilindungi Undang-Undang.</div>
        </div>

        <!-- Bagian Bawah: 4 Daftar Menu -->
        <nav class="bottom-menu">
            <a href="#" class="menu-item">Beranda</a>
            <a href="#" class="menu-item">Galeri</a>
            <a href="#" class="menu-item">Arsip</a>
            <a href="#" class="menu-item">Kartu ID</a>
        </nav>

    </div>

</body>
</html>
