<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PT JRI MUNAWAR GROUP PERSEORANGAN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to bottom, #1e6fd9 0%, #4a90e2 30%, #a8c9ee 65%, #ffffff 100%);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 32px;
  }
  .logo img {
    height: 48px;
    width: auto;
    display: block;
  }
  .nama {
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    line-height: 1.25;
  }
  .nama .utama {
    font-size: 16px;
    font-weight: bold;
  }
  .nama .sub {
    font-size: 9px;
    letter-spacing: 3px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <img src="logo.jpg" alt="Logo JRI">
    </div>
    <div class="nama">
      <div class="utama">PT JRI MUNAWAR GROUP</div>
      <div class="sub">PERSEORANGAN</div>
    </div>
  </div>

</body>
</html>
