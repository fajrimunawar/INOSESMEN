<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrasi Dasbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Outfit:wght@300;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* TIDAK ADA SCROLL */
            background: #01030A; /* Latar hitam kebiruan pekat */
            font-family: 'Outfit', sans-serif;
        }

        .main-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membagi judul ke tengah, menu ke bawah */
            align-items: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Cahaya Latar Organik */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vmin; /* Menggunakan vmin agar menyesuaikan layar terkecil */
            height: 90vmin;
            background: radial-gradient(circle, rgba(0, 86, 210, 0.12) 0%, transparent 60%);
            z-index: 1;
            animation: breathe 10s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* BAGIAN TENGAH (Judul & Hak Cipta) */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* FORMAT KALIMAT JUDUL (Dijamin 1 Baris & Rapi di semua layar) */
        .title-row {
            display: flex;
            align-items: baseline; /* Sejajar di garis dasar bawah */
            justify-content: center;
            white-space: nowrap; /* PAKSA TETAP 1 BARIS */
            margin-bottom: 30px;
        }

        /* Kata 1: Integrasi (Miring, Rongga/Outline) */
        .word-1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: clamp(1.2rem, 5.5vw, 4.5rem); /* Ukuran adaptif super aman */
            color: transparent;
            -webkit-text-stroke: 1px #4080D0; /* Garis luar biru */
            text-transform: capitalize;
            margin-right: clamp(8px, 2vw, 20px); /* Jaga jarak agar tidak nimpa */
        }

        /* Kata 2: Dasbor (Tebal, Masif, Gradasi Biru Tajam) */
        .word-2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 8vw, 6.5rem); /* Ukuran adaptif super aman */
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 0.9;
            
            /* Gradasi Biru Menyala */
            background: linear-gradient(180deg, #0047B3 0%, #009BFF 40%, #00E5FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 122, 227, 0.4));
        }

        /* Garis Pemisah Tipis */
        .divider-line {
            width: clamp(50px, 15vw, 120px);
            height: 1px;
            background: linear-gradient(90deg, transparent, #0072E3, transparent);
            margin-bottom: 20px;
        }

        /* Hak Cipta */
        .copyright {
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            letter-spacing: clamp(3px, 1vw, 6px); /* Spacing menyesuaikan layar */
            text-transform: uppercase;
            color: #4A7BA8;
            font-weight: 300;
        }

        /* BAGIAN BAWAH (Menu Horizontal Rapi) */
        .bottom-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(15px, 5vw, 50px); /* Jarak menu otomatis menyesuaikan layar */
            flex-wrap: wrap; /* Jika layar sangat kecil, akan turun ke bawah dengan rapi */
            width: 100%;
            padding-top: 20px;
        }

        .menu-item {
            text-decoration: none;
            font-size: clamp(0.7rem, 2.2vw, 0.9rem);
            letter-spacing: clamp(2px, 0.5vw, 4px);
            text-transform: uppercase;
            font-weight: 400;
            color: #5A9BD4; /* Biru redup */
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        /* Efek Hover Berkelas (Garis Bawah Meluncir) */
        .menu-item::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 1px;
            background: linear-gradient(90deg, #00C2FF, #00E5FF);
            transition: width 0.3s ease;
        }

        .menu-item:hover {
            color: #00E5FF; /* Biru terang */
        }

        .menu-item:hover::after {
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Latar Cahaya Organik -->
    <div class="ambient-glow"></div>

    <!-- Konten Utama -->
    <div class="main-container">
        
        <!-- Bagian Tengah: Judul & Hak Cipta -->
        <div class="center-content">
            <div class="title-row">
                <span class="word-1">Integrasi</span>
                <span class="word-2">Dasbor</span>
            </div>
            
            <div class="divider-line"></div>
            <div class="copyright">Hak Cipta &copy; 2024</div>
        </div>

        <!-- Bagian Bawah: Daftar Menu Rapi -->
        <nav class="bottom-menu">
            <a href="#" class="menu-item">Beranda</a>
            <a href="#" class="menu-item">Analitik</a>
            <a href="#" class="menu-item">Sistem</a>
            <a href="#" class="menu-item">Profil</a>
        </nav>

    </div>

</body>
</html>
